    <!-- Every page of this site rendered BLACK on any Chrome older than 122,
         and had done since pdf.js was upgraded to 5. Measured on a Pixel 6 with
         Chrome 113: `ReferenceError: Iterator is not defined`, `#root` empty, on
         `/`, `/spaces` and the live site as well as staging.

         pdf.js ships its own polyfill for `Iterator.prototype.join` and writes
         it as `typeof Iterator.prototype.join !== 'function' && (…)` — which
         dereferences the `Iterator` global before deciding whether it exists.
         It is in the vendor chunk, so it runs on every page, not only where a
         PDF is imported, and it throws before React mounts.

         `Iterator` is a Chrome 122 / Safari 18.4 global. %IteratorPrototype%
         itself is ancient and reachable, so this hands the polyfill the real
         object to patch. Inline and before the module, because it must run
         before the bundle parses. -->
    <script>
        (function () {
            if (typeof Iterator !== 'undefined') return
            var proto = Object.getPrototypeOf(Object.getPrototypeOf([][Symbol.iterator]()))
            // NOT named `Iterator`: a function declaration by that name hoists a
            // local binding, `typeof Iterator` above then reads it instead of
            // the global, and the shim returns before doing anything. Caught by
            // oldBrowserFloor.test.js, which runs pdf.js's own line in a realm
            // with the global taken away.
            function IteratorShim() { throw new TypeError('Iterator is abstract') }
            IteratorShim.prototype = proto
            Object.defineProperty(globalThis, 'Iterator', { value: IteratorShim, writable: true, configurable: true })
        })()
    </script>

    <!-- Host-relative on purpose. This shell is served from every address the
         platform answers on — diiii.xyz, di-studio.xyz, dev.diiii.xyz, a `di`
         install on a laptop — and a canonical hardcoded to one of them told a
         search engine that every page on all the others was a copy of the live
         site. Relative resolves against whatever host actually served it, and
         crawlers that do not run scripts already get the absolute, host-derived
         card from serverXR's /og route (nginx forks them there). -->
    <script>
      // Set here rather than written into the tag: this shell is served from
      // every address the platform answers on — diiii.xyz, di-studio.xyz,
      // dev.diiii.xyz, a `di` install on a laptop — and a canonical hardcoded
      // to one of them told search engines that every page on all the others
      // was a copy of the live site. A relative href cannot do the job either:
      // the bundler resolves link[href] as an asset at build time. Crawlers
      // that do not run scripts already receive the absolute, host-derived
      // card from serverXR's /og route, which nginx forks them to.
      (function () {
        var l = document.createElement('link')
        l.rel = 'canonical'
        l.href = location.origin + location.pathname
        document.head.appendChild(l)
      })()
    </script>
