<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values. Without it every inset is 0, which silently neutered Studio's
         existing studio-mobile.css safe-area rules on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>di.iiii — browser-native XR authoring</title>
    <meta name="description" content="di.iiii is a browser-native platform for building and publishing spatial XR experiences — 3D scenes, node-driven behaviors, and AR/VR spaces — without leaving the web.">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />

    <meta property="og:type" content="website">
    <meta property="og:title" content="di.iiii — browser-native XR authoring">
    <meta property="og:description" content="Build and publish spatial XR experiences — 3D scenes, node-driven behaviors, AR/VR spaces — without leaving the web.">
    <meta property="og:image" content="https://di-studio.xyz/brand/og-image.png">
    <meta property="og:url" content="https://di-studio.xyz">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="di.iiii — browser-native XR authoring">
    <meta name="twitter:description" content="Build and publish spatial XR experiences — 3D scenes, node-driven behaviors, AR/VR spaces — without leaving the web.">
    <meta name="twitter:image" content="https://di-studio.xyz/brand/og-image.png">

    <!-- Pre-hydration frame: without this the first paint on a cold load is
         browser white until the JS bundle brings base.css. This mirrors
         LoadingScreen (src/components/loadingScreen.css) exactly -- black,
         one 34px spinner, nothing drawn -- so the pre-JS frame already looks
         like the app rather than a flash of a different product. React's
         createRoot render replaces #root's contents once it mounts. -->
    <style>
        html, body { background: #000; margin: 0; }
        .boot-loading-screen {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #000;
        }
        .boot-loading-spinner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-top-color: rgba(255, 255, 255, 0.85);
            animation: boot-loading-spin 820ms linear infinite;
        }
        @keyframes boot-loading-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .boot-loading-spinner {
                animation: boot-loading-pulse 1600ms ease-in-out infinite;
                border-top-color: rgba(255, 255, 255, 0.55);
            }
            @keyframes boot-loading-pulse { 50% { opacity: 0.3; } }
        }
    </style>
</head>
<body>
    <div id="root"><div class="boot-loading-screen" aria-hidden="true"><div class="boot-loading-spinner"></div></div></div>
    <script type="module" src="./index.jsx"></script></body>
</html>
