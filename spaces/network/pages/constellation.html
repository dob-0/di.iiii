<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>network — di.iiii</title>
<style>
@font-face{
  font-family:'Inter';
  src:url('/fonts/inter-regular.woff') format('woff');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'JetBrains Mono';
  src:url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg0:#000000;
  --ink:#ffffff;
  --ink-dim:rgba(255,255,255,.55);
  --ink-faint:rgba(255,255,255,.30);
  --cyan:#4DF9FF;
  --cyan-bright:#00E5FF;
  --line:rgba(77,249,255,.20);
  --line-soft:rgba(255,255,255,.10);
  --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0!important;}
html,body{margin:0;padding:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--sans);overflow:hidden;}
button,a{font-family:inherit;}
#field{position:fixed;inset:0;display:block;outline:none;}

.mono{font-family:var(--mono);}
.eyebrow{
  font-family:var(--mono);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);
}

header.top{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:26px 32px 0 32px;
  pointer-events:none;
}
header.top .brand{pointer-events:auto;}
header.top .brand .eyebrow{margin-bottom:6px;}
header.top h1{
  font-size:21px;font-weight:800;margin:0;letter-spacing:-0.01em;
}
header.top h1 .dot{color:var(--cyan);}
header.top .hint{
  pointer-events:auto;
  font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);
  text-align:right;line-height:1.6;max-width:230px;
}

/* roster edge index — desktop: thin column, right edge. Real <nav>, real focus. */
#roster{
  position:fixed;top:0;right:0;bottom:0;z-index:20;
  width:248px;
  padding:104px 28px 28px 22px;
  display:flex;flex-direction:column;
  overflow-y:auto;
  background:linear-gradient(to left, rgba(0,0,0,0.78), rgba(0,0,0,0));
}
#roster .group-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin:18px 0 8px 0;
}
#roster .group-label:first-child{margin-top:0;}
#roster ul{list-style:none;margin:0;padding:0;}
#roster li{margin:0;}
#roster .item{
  all:unset;display:block;width:100%;cursor:pointer;box-sizing:border-box;
  padding:7px 0;
  border-top:1px solid var(--line-soft)!important;
  color:var(--ink-dim);
  font-size:13px;
  transition:color .15s ease, padding-left .15s ease;
}
#roster li:last-child .item{border-bottom:1px solid var(--line-soft)!important;}
#roster .item .name{color:var(--ink);display:block;font-weight:500;}
#roster .item .role{display:block;font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);margin-top:1px;}
#roster .item:hover,#roster .item:focus-visible,#roster .item.active{
  color:var(--cyan);padding-left:8px;outline:none;
}
#roster .item:hover .name,#roster .item:focus-visible .name,#roster .item.active .name{color:var(--cyan);}
#roster .item.active::before{content:'';display:inline-block;width:5px;height:5px;background:var(--cyan);margin-right:6px;vertical-align:middle;}
#roster .item.has-room .name::after{content:' →';color:var(--ink-faint);font-weight:400;}
#roster .item.has-room:hover .name::after,#roster .item.has-room:focus-visible .name::after,#roster .item.has-room.active .name::after{color:var(--cyan);}

/* hover / select label + doors, floats near the node in 3D space */
#node-label{
  position:fixed;z-index:30;pointer-events:none;
  transform:translate(18px,-50%);
  opacity:0;transition:opacity .18s ease;
  max-width:290px;
}
#node-label.show{opacity:1;pointer-events:auto;}
#node-label .name{font-size:19px;font-weight:800;letter-spacing:-0.01em;margin:0 0 2px 0;}
#node-label .role{font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:.03em;margin:0 0 10px 0;text-transform:lowercase;}
#node-label .doors{display:flex;flex-direction:column;gap:5px;}
#node-label .door{
  border:1px solid var(--line);background:rgba(0,0,0,0.86);
  padding:6px 10px;font-size:11.5px;color:var(--ink-dim);
  display:flex;justify-content:space-between;gap:14px;
  text-decoration:none;
}
#node-label .door:hover,#node-label .door:focus-visible{border-color:var(--cyan);outline:none;}
#node-label .door .t{color:var(--ink);}
#node-label .door.empty{color:var(--ink-faint);font-family:var(--mono);font-size:10.5px;}
#node-label .tap{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:10px;}

footer.legend{
  position:fixed;left:32px;bottom:26px;z-index:20;
  display:flex;gap:22px;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
}
footer.legend .sw{display:inline-flex;align-items:center;gap:7px;}
footer.legend .dot{width:7px;height:7px;background:var(--ink);display:inline-block;}
footer.legend .dot.net{width:4px;height:4px;background:var(--ink-faint);}

#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
#sheet-toggle{display:none;}

@media (max-width: 760px){
  header.top{padding:18px 18px 0 18px;}
  header.top .hint{display:none;}
  header.top h1{font-size:17px;}
  footer.legend{left:18px;bottom:calc(64px + env(safe-area-inset-bottom));font-size:9.5px;gap:14px;}

  #roster{
    top:auto;right:0;left:0;bottom:0;width:auto;
    height:56px;
    padding:0;
    background:#050505;
    border-top:1px solid var(--line);
    transition:height .28s cubic-bezier(.2,.7,.3,1);
    overflow:hidden;
  }
  #roster.open{height:64vh;overflow-y:auto;}
  #sheet-toggle{
    all:unset;
    display:flex;align-items:center;justify-content:space-between;
    width:100%;height:56px;flex:none;box-sizing:border-box;
    padding:0 18px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
  }
  #sheet-toggle .n{color:var(--ink-faint);}
  #roster .scroll{padding:0 18px 24px 18px;}
  #roster.open #sheet-toggle{border-bottom:1px solid var(--line-soft);}

  #node-label{
    left:16px!important;right:16px!important;top:auto!important;bottom:78px!important;
    transform:none;max-width:none;
  }
}
@media (prefers-reduced-motion: reduce){
  #roster.open, #roster{transition:none;}
}
</style>

    p._tier = 'team';
  });

  const gap = 0.10;
  const totalNetwork = network.length;
  let angleCursor = -Math.PI/2 - 0.4;
  clusters.forEach(c=>{
    const span = (c.list.length/totalNetwork) * (Math.PI*2 - gap*clusters.length);
    c._angleStart = angleCursor;
    c._angleSpan = span;
    angleCursor += span + gap;
    c.list.forEach((p,i)=>{
      const t = c.list.length>1 ? i/(c.list.length-1) : 0.5;
      const a = c._angleStart + t*c._angleSpan;
      const r = 7.3 + Math.sin(i*2.3 + c.key.length)*1.15;
      const y = -0.5 + Math.cos(i*1.9)*0.95;
      p._pos = new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r);
      p._tier = 'network';
      p._cluster = c.key;
    });
  });
}
place();

// ---------------------------------------------------------------------------
// EDGES — faint lines only where work or discipline is shared. Chained
// (not all-pairwise) so a cluster of N draws N lines, not N².
// ---------------------------------------------------------------------------
const edges = [];
function chain(list, isWork){
  for(let i=0;i<list.length-1;i++) edges.push({a:list[i], b:list[i+1], isWork});
  if(list.length>2) edges.push({a:list[list.length-1], b:list[0], isWork});
}
chain(team, false);
clusters.forEach(c=>{ if(c.list.length>1) chain(c.list, false); });
{
  const byHref = {};
  PEOPLE.forEach(p=>(p.works||[]).forEach(w=>{
    (byHref[w.href] = byHref[w.href] || []).push(p);
  }));
  Object.values(byHref).forEach(group=>{ if(group.length>1) chain(group, true); });
}

// ---------------------------------------------------------------------------
// THREE SCENE
// ---------------------------------------------------------------------------
const canvas = document.getElementById('field');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.05);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
let camPos = new THREE.Vector3(0, 3.2, 14.5);
let camTarget = new THREE.Vector3(0,0,0);
camera.position.copy(camPos);
camera.lookAt(camTarget);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// grid floor — the house motif
{
  const grid = new THREE.GridHelper(64, 64, 0x0f2a3a, 0x08151f);
  grid.position.y = -3.4;
  grid.material.transparent = true;
  grid.material.opacity = 0.5;
  scene.add(grid);
}

// faint starfield for depth — one pooled Points draw call
{
  const N = 700;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r = 20 + Math.random()*40;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos((Math.random()*2)-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = Math.abs(r*Math.cos(ph))*0.5 - 4;
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0x2a3444, size:0.045, transparent:true, opacity:0.5});
  scene.add(new THREE.Points(g,m));
}

// ---------------------------------------------------------------------------
// EDGE LINES — one pooled LineSegments draw call for all edges
// ---------------------------------------------------------------------------
const edgeGeo = new THREE.BufferGeometry();
const edgePos = new Float32Array(edges.length*6);
const edgeCol = new Float32Array(edges.length*6);
edges.forEach((e,i)=>{
  edgePos[i*6+0]=e.a._pos.x; edgePos[i*6+1]=e.a._pos.y; edgePos[i*6+2]=e.a._pos.z;
  edgePos[i*6+3]=e.b._pos.x; edgePos[i*6+4]=e.b._pos.y; edgePos[i*6+5]=e.b._pos.z;
});
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos,3));
edgeGeo.setAttribute('color', new THREE.BufferAttribute(edgeCol,3));
const edgeMat = new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:1});
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

const COL_COHESION = new THREE.Color(0x142230);
const COL_WORK = new THREE.Color(0x1f4a5c);
const COL_ACTIVE = new THREE.Color(0x4DF9FF);
function paintEdges(){
  const arr = edgeCol;
  edges.forEach((e,i)=>{
    const active = (hovered===e.a || hovered===e.b || selected===e.a || selected===e.b);
    const c = active ? COL_ACTIVE : (e.isWork ? COL_WORK : COL_COHESION);
    arr[i*6+0]=c.r; arr[i*6+1]=c.g; arr[i*6+2]=c.b;
    arr[i*6+3]=c.r; arr[i*6+4]=c.g; arr[i*6+5]=c.b;
  });
  edgeGeo.attributes.color.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// NODES — two pooled Points clouds (one draw call each): a hard-edged dot
// for the core, a soft falloff for the glow halo. Both are plain attribute-
// driven custom shaders (position/aColor/aScale), not InstancedMesh — this
// build's InstancedMesh.setColorAt()/instanceColor path renders solid black
// on this three.js core+module combination (isolated and confirmed: uniform
// instance color works, per-instance vertexColors does not), so per-instance
// color here is carried the same verified way the glow layer already used.
// ---------------------------------------------------------------------------
const N = PEOPLE.length;
const posArr = new Float32Array(N*3);
PEOPLE.forEach((p,i)=>{
  posArr[i*3]=p._pos.x; posArr[i*3+1]=p._pos.y; posArr[i*3+2]=p._pos.z;
});

const coreCol = new Float32Array(N*3);
const coreScale = new Float32Array(N);
const coreGeo = new THREE.BufferGeometry();
coreGeo.setAttribute('position', new THREE.BufferAttribute(posArr,3));
coreGeo.setAttribute('aColor', new THREE.BufferAttribute(coreCol,3));
coreGeo.setAttribute('aScale', new THREE.BufferAttribute(coreScale,1));

const glowCol = new Float32Array(N*3);
const glowScale = new Float32Array(N);
const glowGeo = new THREE.BufferGeometry();
glowGeo.setAttribute('position', new THREE.BufferAttribute(posArr,3));
glowGeo.setAttribute('aColor', new THREE.BufferAttribute(glowCol,3));
glowGeo.setAttribute('aScale', new THREE.BufferAttribute(glowScale,1));

// aScale is authored in target on-screen pixels at a 12-unit reference
// camera distance (roughly where most nodes sit); uSizeK carries that
// reference distance so core/glow can each convert it independently.
const dotVertex = `
  attribute vec3 aColor;
  attribute float aScale;
  varying vec3 vColor;
  uniform float uPixelRatio;
  uniform float uSizeK;
  void main(){
    vColor = aColor;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aScale * (uSizeK / -mv.z) * uPixelRatio;
    gl_Position = projectionMatrix * mv;
  }
`;
const coreMat = new THREE.ShaderMaterial({
  uniforms:{ uPixelRatio: {value: Math.min(window.devicePixelRatio||1,2)}, uSizeK: {value: 12.0} },
  vertexShader: dotVertex,
  fragmentShader:`
    varying vec3 vColor;
    void main(){
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c) * 2.0;
      float a = smoothstep(1.0, 0.72, d);
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent:true, depthWrite:false
});
const corePoints = new THREE.Points(coreGeo, coreMat);
scene.add(corePoints);

const glowMat = new THREE.ShaderMaterial({
  uniforms:{ uPixelRatio: {value: Math.min(window.devicePixelRatio||1,2)}, uSizeK: {value: 9.0} },
  vertexShader: dotVertex,
  fragmentShader:`
    varying vec3 vColor;
    void main(){
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c) * 2.0;
      float a = smoothstep(1.0, 0.0, d);
      a = pow(a, 1.8);
      gl_FragColor = vec4(vColor, a * 0.9);
    }
  `,
  transparent:true, depthWrite:false
});
const glowPoints = new THREE.Points(glowGeo, glowMat);
scene.add(glowPoints);

const COL_TEAM = new THREE.Color(0xffffff);
const COL_NET = new THREE.Color(0x7c8ba0);
const COL_HOVER = new THREE.Color(0x4DF9FF);

function paintNodes(){
  PEOPLE.forEach((p,i)=>{
    const isTeam = p._tier==='team';
    const active = (hovered===p) || (selected===p);

    const coreSize = isTeam ? 13 : 8;
    coreScale.set([active ? coreSize*1.5 : coreSize], i);
    const cc = active ? COL_HOVER : (isTeam ? COL_TEAM : COL_NET);
    coreCol.set([cc.r, cc.g, cc.b], i*3);

    const baseGlow = isTeam ? 26 : 15;
    glowScale.set([active ? baseGlow*1.7 : baseGlow], i);
    const gc = active ? COL_HOVER : (isTeam ? COL_TEAM : new THREE.Color(0x3a4658));
    glowCol.set([gc.r, gc.g, gc.b], i*3);
  });
  coreGeo.attributes.aScale.needsUpdate = true;
  coreGeo.attributes.aColor.needsUpdate = true;
  glowGeo.attributes.aScale.needsUpdate = true;
  glowGeo.attributes.aColor.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// INTERACTION — drag orbit (weighty damping), hover/select, roster sync
// ---------------------------------------------------------------------------
let az = 0.35, pol = 0.24;
let curAz = az, curPol = pol;
let dragging = false, lastX=0, lastY=0, moved=false;

canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; moved=false; });
window.addEventListener('pointerup', ()=> dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
  lastX=e.clientX; lastY=e.clientY;
  az -= dx*0.0032;
  pol = Math.max(-0.5, Math.min(0.75, pol - dy*0.0022));
});

let hovered = null;
let selected = null;
let flying = false, flyT=0, flyFrom=null, flyTo=null, flyLookFrom=null, flyLookTo=null, flyTarget=null;

const raycaster = new THREE.Raycaster();
raycaster.params.Points = {threshold: 0.32};
const pointerNDC = new THREE.Vector2(-9,-9);

canvas.addEventListener('pointermove', e=>{
  if(dragging) return;
  pointerNDC.x = (e.clientX/innerWidth)*2-1;
  pointerNDC.y = -(e.clientY/innerHeight)*2+1;
});
canvas.addEventListener('pointerleave', ()=> setHover(null));

canvas.addEventListener('click', e=>{
  if(moved) return;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(corePoints);
  if(hits.length){
    const p = PEOPLE[hits[0].index];
    selectPerson(p);
  }
});

function selectPerson(p){
  selected = p;
  setHover(p);
  if(p.room){
    flying = true; flyT = 0;
    flyFrom = camera.position.clone();
    flyTo = p._pos.clone().add(new THREE.Vector3(0,0.35,2.1));
    flyLookFrom = camTarget.clone();
    flyLookTo = p._pos.clone();
    flyTarget = p.room;
    setTimeout(()=>{ if(flyTarget===p.room) navigateTop(p.room); }, prefersReducedMotion ? 60 : 850);
  }
}

function setHover(p){
  if(hovered===p) return;
  hovered = p;
  updateLabel();
  syncRosterActive();
  paintNodes();
  paintEdges();
}

function updateLabel(){
  const el = document.getElementById('node-label');
  const p = hovered;
  if(!p){ el.classList.remove('show'); return; }
  el.querySelector('.name').textContent = p.name;
  el.querySelector('.role').textContent = p.role + ' · ' + (p._tier==='team' ? 'team' : p.disc);
  const doorsEl = el.querySelector('.doors');
  doorsEl.innerHTML = '';
  let any = false;
  if(p.room){
    any = true;
    const d = document.createElement('a');
    d.className='door'; d.href=p.room; d.target='_top'; d.rel='noopener';
    d.innerHTML = '<span class="t">their room</span><span>enter →</span>';
    doorsEl.appendChild(d);
  }
  (p.works||[]).slice(0,3).forEach(w=>{
    any = true;
    const d = document.createElement('a');
    d.className='door'; d.href=w.href; d.target='_top'; d.rel='noopener';
    d.innerHTML = '<span class="t">'+esc(w.title)+'</span><span>'+esc(w.line)+'</span>';
    doorsEl.appendChild(d);
  });
  if(!any){
    const d = document.createElement('div');
    d.className='door empty';
    d.textContent = 'no door yet — theirs to open';
    doorsEl.appendChild(d);
  }
  el.classList.add('show');
  document.getElementById('sr-status').textContent = p.name + ', ' + p.role;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function positionLabel(){
  const el = document.getElementById('node-label');
  if(!hovered || window.innerWidth<=760) return;
  const v = hovered._pos.clone().project(camera);
  const x = (v.x*0.5+0.5)*innerWidth;
  const y = (-v.y*0.5+0.5)*innerHeight;
  el.style.left = x+'px';
  el.style.top = y+'px';
}

// ---------------------------------------------------------------------------
// ROSTER — same data, real DOM, keyboard + screen reader. Team first, then
// network grouped by discipline cluster. A person with a room is a real
// target="_top" anchor; everyone else is a selectable button.
// ---------------------------------------------------------------------------
const rosterScroll = document.getElementById('roster-scroll');
function buildRoster(){
  const groups = [['TEAM', team]].concat(clusters.map(c=>[DISC_LABEL[c.key], c.list]));
  groups.forEach(([label,list])=>{
    if(!list.length) return;
    const gl = document.createElement('div');
    gl.className='group-label'; gl.textContent = label + ' — ' + list.length;
    rosterScroll.appendChild(gl);
    const ul = document.createElement('ul');
    list.forEach(p=>{
      const li = document.createElement('li');
      const el = document.createElement(p.room ? 'a' : 'button');
      el.className = 'item' + (p.room ? ' has-room' : '');
      if(p.room){ el.href = p.room; el.target='_top'; el.rel='noopener'; }
      else { el.type = 'button'; }
      el.dataset.slug = p.slug;
      el.setAttribute('aria-label', p.name + ', ' + p.role + (p.room ? ' — opens their room' : ''));
      el.innerHTML = '<span class="name">'+esc(p.name)+'</span><span class="role">'+esc(p.role)+'</span>';
      el.addEventListener('mouseenter', ()=> setHover(p));
      el.addEventListener('focus', ()=> setHover(p));
      el.addEventListener('mouseleave', ()=> { if(hovered===p) setHover(null); });
      if(!p.room){ el.addEventListener('click', ()=> selectPerson(p)); }
      li.appendChild(el);
      ul.appendChild(li);
    });
    rosterScroll.appendChild(ul);
  });
}
buildRoster();
function syncRosterActive(){
  document.querySelectorAll('#roster .item').forEach(b=>{
    b.classList.toggle('active', hovered && b.dataset.slug===hovered.slug);
  });
}

// mobile bottom sheet
const rosterEl = document.getElementById('roster');
const sheetToggle = document.getElementById('sheet-toggle');
sheetToggle.addEventListener('click', ()=>{
  const open = rosterEl.classList.toggle('open');
  sheetToggle.setAttribute('aria-expanded', String(open));
  sheetToggle.querySelector('.n').textContent = open ? '▼' : '▲';
});

// ---------------------------------------------------------------------------
// DEV/SCREENSHOT HOOK — ?hover=slug forces a hover state deterministically
// ---------------------------------------------------------------------------
(function(){
  const q = new URLSearchParams(location.search);
  const forced = q.get('hover');
  if(forced){
    const p = PEOPLE.find(pp=>pp.slug===forced);
    if(p) setTimeout(()=> setHover(p), 60);
  }
  if(q.get('sheet')==='open'){ rosterEl.classList.add('open'); sheetToggle.setAttribute('aria-expanded','true'); }
})();

// ---------------------------------------------------------------------------
// RENDER LOOP
// ---------------------------------------------------------------------------
paintNodes();
paintEdges();
let lastFrame = performance.now();
function animate(){
  requestAnimationFrame(animate);

  if(!prefersReducedMotion && isCoarsePointer && !dragging && !flying){
    az += 0.00028; // phone: drifting backdrop
  }

  curAz += (az-curAz)*0.06;
  curPol += (pol-curPol)*0.06;

  if(!flying){
    const r = 14.5;
    camPos.set(
      Math.sin(curAz)*r*Math.cos(curPol),
      3.2 + Math.sin(curPol)*4.4,
      Math.cos(curAz)*r*Math.cos(curPol)
    );
    camera.position.copy(camPos);
    camera.lookAt(camTarget);
  } else {
    flyT = Math.min(1, flyT + 0.02);
    const e = 1 - Math.pow(1-flyT, 3);
    camera.position.lerpVectors(flyFrom, flyTo, e);
    const look = new THREE.Vector3().lerpVectors(flyLookFrom, flyLookTo, e);
    camera.lookAt(look);
  }

  if(!dragging && !isCoarsePointer){
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(corePoints);
    if(hits.length) setHover(PEOPLE[hits[0].index]);
    else if(!new URLSearchParams(location.search).get('hover')) setHover(null);
  }

  positionLabel();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
