// ---------- the yard's cloud, with its red reveal front (from the yard page) ----------
const uni={uFront:{value:-5.6},uPx:{value:1.35*pr},uTime:{value:0},uFade:{value:1}};
async function inflate(buf){
  if(typeof DecompressionStream==='undefined') throw new Error('browser too old');
  const st=new Blob([new Uint8Array(buf)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
let cloud=null;
async function buildCloud(){
  const pb=await inflate(await CLOUD), n=PMETA.n;
  const q=new Uint16Array(pb.buffer,0,n*3), cols=new Uint8Array(pb.buffer,n*6,n*3);
  const pos=new Float32Array(n*3), col=new Float32Array(n*3), rnd=new Float32Array(n);
  for(let i=0;i<n;i++){for(let k=0;k<3;k++){pos[i*3+k]=PMETA.min[k]+q[i*3+k]/65535*PMETA.range[k];col[i*3+k]=cols[i*3+k]/255;}rnd[i]=Math.random();}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aRnd',new THREE.BufferAttribute(rnd,1));
  const m=new THREE.ShaderMaterial({uniforms:uni,
   vertexShader:`attribute vec3 aColor; attribute float aRnd;
    uniform float uFront,uPx,uTime,uFade;
    varying vec3 vC; varying float vEdge; varying float vVis;
    void main(){
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      float d=uFront-position.x;
      vEdge=smoothstep(0.22,0.0,abs(d+0.06));
      vVis=step(0.0,d)*step(0.01,uFade);
      vC=aColor;
      float tw=0.85+0.3*sin(uTime*(0.6+aRnd)+aRnd*6.2831);
      gl_PointSize=uPx*(0.55+3.2/max(1.5,-mv.z))*(1.0+1.8*vEdge)*tw*vVis*uFade;
      gl_Position=projectionMatrix*mv;}`,
   fragmentShader:`precision mediump float;
    varying vec3 vC; varying float vEdge; varying float vVis;
    void main(){
      if(vVis<0.5) discard;
      vec2 p=gl_PointCoord-0.5; if(dot(p,p)>0.25) discard;
      gl_FragColor=vec4(mix(vC,vec3(0.851,0.169,0.110),vEdge),1.0);}`});
  cloud=new THREE.Points(g,m); scene.add(cloud);
}

// ---------- the wall's fragments (from the wall page) ----------
function unpack(buf){
  const dv=new DataView(buf), jl=dv.getUint32(4,true);
  const manifest=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,8,jl))), base=8+jl;
  manifest.models.forEach(m=>{
    const q=new Uint16Array(buf,base+m.pos,m.nv*3), quv=new Uint16Array(buf,base+m.uv,m.nv*2);
    const pos=new Float32Array(m.nv*3), uv=new Float32Array(m.nv*2);
    const s=[0,1,2].map(k=>(m.qmax[k]-m.qmin[k])/65535);
    for(let i=0;i<m.nv;i++){
      for(let k=0;k<3;k++) pos[i*3+k]=m.qmin[k]+q[i*3+k]*s[k];
      uv[i*2]=quv[i*2]/65535; uv[i*2+1]=quv[i*2+1]/65535;
    }
    m.positions=pos; m.uvs=uv;
    m.indices=new Uint16Array(buf,base+m.idx,m.nf*3).slice();
    m.texBytes=new Uint8Array(buf,base+m.tex,m.texLen);
  });
  manifest.shadowBytes=new Uint8Array(buf,base+manifest.shadow.off,manifest.shadow.len);
  return manifest;
}
// Through an <img>, so three.js can flip it on upload (flipY). An ImageBitmap ignores flipY.
function loadImage(src){
  return new Promise((res,rej)=>{const img=new Image();img.crossOrigin='anonymous';
    const url=typeof src==='string'?src:URL.createObjectURL(new Blob([src],{type:'image/webp'}));
    img.onload=()=>{if(typeof src!=='string')URL.revokeObjectURL(url);res(img);};img.onerror=()=>rej(new Error('photo'));img.src=url;});
}
const COMMON=`
  float lum(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
  vec3 rgb2hsv(vec3 c){
    vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);
    vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
    vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));
    float d=q.x-min(q.w,q.y); float e=1.0e-10;
    return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);
  }
  // grayscale except the red chalk, which stays as a muted red
  vec3 monoRed(vec3 t,float redSat){
    float L=lum(t); vec3 hsv=rgb2hsv(t); float h=hsv.x*360.0;
    float isRed=clamp(step(h,22.0)+step(335.0,h),0.0,1.0)*step(0.35,hsv.y)*step(0.25,hsv.z);
    vec3 red=vec3(L)+(t-vec3(L))*redSat*1.6;
    return mix(vec3(L),red,isRed);
  }`;
const SOLID_VS=`
  varying vec2 vUv; varying vec3 vN; varying float vX;
  void main(){
    vUv=uv; vN=normalize(mat3(modelMatrix)*normal);
    vec4 w=modelMatrix*vec4(position,1.0); vX=w.x;
    gl_Position=projectionMatrix*viewMatrix*w;
  }`;
const SOLID_FS=COMMON+`
  uniform sampler2D map; uniform vec3 lightDir; uniform float ambient; uniform int mode;
  uniform float scanX; uniform vec3 paper; uniform float desat; uniform float redSat; uniform float opacity; uniform float photo;
  varying vec2 vUv; varying vec3 vN; varying float vX;
  void main(){
    vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n;
    float sh=ambient+(1.0-ambient)*max(dot(n,lightDir),0.0);
    vec3 t=texture2D(map,vUv).rgb; vec3 c;
    if(mode==0){c=mix(mix(vec3(lum(t)),t,desat)*sh,t,photo);}   // photo 1: as photographed (the yard page); 0: the wall page's light
    else if(mode==1){c=monoRed(t,redSat)*sh;}
    else{
      vec3 col=mix(vec3(lum(t)),t,desat)*sh; vec3 mono=monoRed(t,redSat)*sh;
      float d=vX-scanX;
      vec3 basec=d>0.0?mix(paper,mono,0.28):mono;
      c=mix(basec,col,1.0-smoothstep(0.22,0.55,abs(d)));
      c=mix(c,vec3(0.72,0.20,0.17),(1.0-smoothstep(0.0,0.018,abs(d)))*0.9);
    }
    gl_FragColor=vec4(c,opacity);
  }`;
const POINT_VS=`
  uniform float proj; uniform float worldSize; varying vec2 vUv;
  void main(){
    vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.0);
    gl_PointSize=clamp(worldSize*proj/-mv.z,1.0,14.0);
    gl_Position=projectionMatrix*mv;
  }`;
const POINT_FS=COMMON+`
  uniform sampler2D map; uniform float redSat; varying vec2 vUv;
  void main(){
    vec2 d=gl_PointCoord-0.5; if(dot(d,d)>0.25) discard;
    vec3 c=monoRed(texture2D(map,vUv).rgb,redSat);
    gl_FragColor=vec4(mix(c,vec3(1.0),0.05),1.0);
  }`;
const shared={mode:{value:0},photo:{value:1},scanX:{value:0},lightDir:{value:V(-0.4,1.0,0.8).normalize()},ambient:{value:0.55},
  paper:{value:new THREE.Color(PAPER)},desat:{value:0.85},redSat:{value:0.55},proj:{value:1000},worldSize:{value:0.026}};
const fragments=[];
let shadowMat=null, row=null;       // row: the wall arrangement's frame (centre, width, height, x range)
const OFF=new THREE.Vector3();      // wall page coordinates -> yard coordinates (the courtyard does not move)
const SHADOW_OPACITY=0.15;
// flipY: the scans' UVs expect the photo the usual way up. Measured 2026-10-21 (spaces/dilijan/aren/texcheck.py): with
// flipY=true every surface's seams agree (r 0.72-0.94) and, at its exact place, its photo matches the cloud's own colours
// (10 cm patches r 0.97-0.99); with flipY=false, the wall page's setting, both are about 0: every face showed another part
// of the photo (the owner: "all textures in not the right place"). The shadow keeps the wall page's setting (not measured).
function makeTexture(img,flipY=true){
  const tex=new THREE.Texture(img); tex.flipY=flipY; tex.needsUpdate=true;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  tex.minFilter=THREE.LinearMipmapLinearFilter; tex.magFilter=THREE.LinearFilter;
  return tex;
}
function buildFragment(m,img,only,opts){
  opts=opts||{};
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(m.positions,3));
  geo.setAttribute('uv',new THREE.BufferAttribute(m.uvs,2));
  geo.setIndex(new THREE.BufferAttribute(m.indices,1));
  geo.computeVertexNormals();
  const tex=makeTexture(img);
  const op={value:0};
  const solid=new THREE.Mesh(geo,new THREE.ShaderMaterial({vertexShader:SOLID_VS,fragmentShader:SOLID_FS,side:THREE.DoubleSide,transparent:true,
    uniforms:{map:{value:tex},mode:shared.mode,photo:shared.photo,scanX:shared.scanX,lightDir:shared.lightDir,ambient:shared.ambient,paper:shared.paper,
      desat:shared.desat,redSat:shared.redSat,opacity:op}}));
  // wire: paper fill (hidden-line) + ink lines
  const fill=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:PAPER,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1.5,polygonOffsetUnits:2}));
  const wire=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x141414,wireframe:true,transparent:true,opacity:0.42}));
  fill.visible=wire.visible=false;
  const group=new THREE.Group(); group.add(solid,fill,wire);
  const y=only==='yard'?{q:[0,0,0,1],t:[0,0,0]}:IN_YARD[m.name]||{q:[0,0,0,1],t:m.center};
  const w=only==='yard'?null:IN_WALL[m.name];        // Պատը: the elevation's pose (and the scale of a piece scanned apart)
  // stay: never moves (shown in one arrangement only); swap: the same surface as another part, so it changes at once
  group.userData={solid,fill,wire,points:null,tex,model:m,op,only,stay:!!opts.stay,swap:!!opts.swap,fade:only==='wall'?0:1,
    yard:{p:new THREE.Vector3().fromArray(y.t),q:y.q?new THREE.Quaternion().fromArray(y.q):new THREE.Quaternion().setFromAxisAngle(V(0,1,0),(y.yaw||0)*Math.PI/180)},
    wall:w?{p:new THREE.Vector3().fromArray(w.t),q:new THREE.Quaternion().fromArray(w.q)}:{p:new THREE.Vector3().fromArray(m.center).add(OFF),q:new THREE.Quaternion()}};
  if(w&&w.s) group.scale.setScalar(w.s);
  group.position.copy(group.userData.yard.p); group.quaternion.copy(group.userData.yard.q);
  scene.add(group);
  return group;
}
// the cloud of a fragment (the wall page's 'cloud' look) is built the first time it is asked for
function ensurePoints(g){
  if(g.userData.points) return g.userData.points;
  const m=g.userData.model;
  const points=new THREE.Points(samplePoints(m,Math.round(m.area*2600)),new THREE.ShaderMaterial({vertexShader:POINT_VS,fragmentShader:POINT_FS,
    uniforms:{map:{value:g.userData.tex},redSat:shared.redSat,proj:shared.proj,worldSize:shared.worldSize}}));
  g.add(points); g.userData.points=points;
  return points;
}
function samplePoints(m,count){
  const P=m.positions,U=m.uvs,I=m.indices,nf=m.nf,cum=new Float64Array(nf);let acc=0;
  for(let f=0;f<nf;f++){
    const i0=I[f*3]*3,i1=I[f*3+1]*3,i2=I[f*3+2]*3;
    const ax=P[i1]-P[i0],ay=P[i1+1]-P[i0+1],az=P[i1+2]-P[i0+2],bx=P[i2]-P[i0],by=P[i2+1]-P[i0+1],bz=P[i2+2]-P[i0+2];
    const cx=ay*bz-az*by,cy=az*bx-ax*bz,cz=ax*by-ay*bx;
    acc+=Math.sqrt(cx*cx+cy*cy+cz*cz)*0.5; cum[f]=acc;
  }
  const pos=new Float32Array(count*3),uv=new Float32Array(count*2);
  for(let k=0;k<count;k++){
    const r=Math.random()*acc;let lo=0,hi=nf-1;
    while(lo<hi){const mid=(lo+hi)>>1;if(cum[mid]<r)lo=mid+1;else hi=mid;}
    const i0=I[lo*3],i1=I[lo*3+1],i2=I[lo*3+2];
    let u=Math.random(),v=Math.random(); if(u+v>1){u=1-u;v=1-v;} const w=1-u-v;
    for(let d=0;d<3;d++) pos[k*3+d]=w*P[i0*3+d]+u*P[i1*3+d]+v*P[i2*3+d];
    for(let d=0;d<2;d++) uv[k*2+d]=w*U[i0*2+d]+u*U[i1*2+d]+v*U[i2*2+d];
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  return g;
}
// The wall page baked one contact shadow under its row. Each fragment takes the part under it (cut halfway between
// neighbours) and carries it as a child, so the shadow stays under its piece wherever the elevation stands it (physics
// first: no shadow where nothing stands). A part lies at its fragment's own lowest point.
// The building's footprint from OpenStreetMap (spaces/dilijan/building-footprint.json, ODbL), brought into the scan's
// frame by building.py (FOOT, plan x z) and drawn as one thin ink line on the ground line of the facades (WALL_VIEW.foot).
let footMat=null;
function buildFootprint(){
  if(typeof FOOT==='undefined'||!FOOT.length) return;
  const y=WALL_VIEW.foot??0, g=new THREE.BufferGeometry().setFromPoints(FOOT.map(([x,z])=>V(x,y,z)));
  footMat=new THREE.LineBasicMaterial({color:0x141414,transparent:true,opacity:0,depthWrite:false});

// ---------- the yard's tour (from the yard page) ----------
const camCurve=new THREE.CatmullRomCurve3([

// ---------- the one view's state ----------
const LOOKS=['colour','mono','scan','cloud','wire'];

let wallOrbit={theta:WALL_VIEW.theta,phi:WALL_PHI,dist:20};
