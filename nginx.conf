# A link preview is fetched by a bot, not a person. The client is a single-page
# app, so index.html carries one set of meta tags for every route — which is why
# every di.iiii link previewed as the same platform tile. Known crawlers go to
# serverXR instead, which knows which space the path names.
map $http_user_agent $dii_crawler {
    default 0;
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Slackbot|WhatsApp|Discordbot|LinkedInBot|SkypeUriPreview|Mastodon|Pinterest|redditbot|Applebot|vkShare|Iframely|embedly)" 1;
}

server {
    # 8080, not 80 (audit #27): the container runs as a non-root user
    # (nginxinc/nginx-unprivileged), which can't bind a port below 1024.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — text/code formats only; images, video, and glb/gltf
    # binaries are already compressed, so gzip'ing them wastes CPU.
    gzip on;
    gzip_min_length 1024;
    # Caddy fronts this container and adds a `Via` header, which is exactly how
    # nginx decides a request is proxied — and gzip_proxied defaults to `off`.
    # Without this line every HTML/JS/CSS response went out uncompressed in
    # production while the config above looked correct: three-vendor.js shipped
    # 1,614,468 B instead of 459,321 B. Verify after deploy with
    #   curl -sI -H 'Accept-Encoding: gzip' https://di-studio.xyz/assets/<chunk>.js
    # which must report `content-encoding: gzip`.
    gzip_proxied any;
    # Caches key on Accept-Encoding, so a compressed response is never served
    # to a client that did not ask for one.
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Security headers — no CSP: the app loads user-authored code/WASM/3D
    # assets from many origins (Google Drive imports, etc.), and a wrong
    # CSP would break real features. Scoping a proper CSP is a separate task.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # WebSocket — must be matched before the broader /serverXR/ block
    location /serverXR/socket.io/ {
        proxy_pass http://server:4000/serverXR/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # WebSocket — the br_id_ge co-presence mesh (raw ws, not socket.io).
    # Prefix must survive: meshHub matches the full /serverXR/mesh path.
    location /serverXR/mesh {
        proxy_pass http://server:4000/serverXR/mesh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Backend API
    location /serverXR/ {
        proxy_pass http://server:4000/serverXR/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 110m;
    }

    # Vite's hashed-output directory — filenames are content-hashed
    # (e.g. App-D68rdMZw.js), so a new build always gets new URLs and
    # these can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx only inherits server-level add_header when a location has
        # none of its own — since this block sets Cache-Control, the
        # security headers above must be repeated here or they're dropped.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA routes that collide with a real static-asset directory of the same
    # name (e.g. /wcc, served from public/wcc/) must still load the app --
    # otherwise try_files' $uri/ clause below matches the directory first and
    # nginx 403s (no index file, autoindex off) instead of falling through.
    # Mirrors the equivalent RewriteRule in .htaccess, the Apache/cPanel path.
    location ~ ^/wcc/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        # See /assets/ above: a location's own add_header suppresses the
        # server-level security headers unless repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The one-liner. These have to be exact-match blocks placed before the SPA
    # catch-all below, or /get returns index.html and `curl … | sh` pipes an
    # HTML page into a shell.
    #
    # text/plain so a browser shows the script instead of downloading it —
    # people do read this before running it, and should. Cacheable but short:
    # the URL goes on workshop handouts and outlives any one release, so it must
    # never be stale for long.
    location = /get {
        default_type text/plain;
        try_files /get.sh =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /get.sh {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /get.ps1 {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA — all other paths fall through to index.html
    location / {
        # `if` is discouraged in nginx, but proxy_pass is one of the two uses
        # that is documented as safe inside it.
        if ($dii_crawler) {
            proxy_pass http://server:4000/serverXR/og$uri;
        }
        try_files $uri $uri/ /index.html;

        # index.html references the current hashed asset filenames, so it
        # must always be revalidated rather than cached long-term.
        add_header Cache-Control "no-cache" always;
        # See /assets/ above: a location's own add_header suppresses the
        # server-level security headers unless repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
