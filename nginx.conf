# A link preview is fetched by a bot, not a person. The client is a single-page
# app, so index.html carries one set of meta tags for every route — which is why
# every di.iiii link previewed as the same platform tile. Known crawlers go to
# serverXR instead, which knows which space the path names.
map $http_user_agent $dii_crawler {
    default 0;
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Slackbot|WhatsApp|Discordbot|LinkedInBot|SkypeUriPreview|Mastodon|Pinterest|redditbot|Applebot|vkShare|Iframely|embedly)" 1;
}

# TLS is terminated by Caddy in front of this container, so `$scheme` HERE is
# always http — the hop from Caddy to nginx is plaintext inside the compose
# network. Setting X-Forwarded-Proto to $scheme therefore overwrote Caddy's
# truthful `https` with `http`, and the card went out advertising
# http://staging.di-studio.xyz for og:url, og:image and the canonical link.
# Prefer what the edge already told us; fall back to $scheme when nothing did
# (serverXR addressed directly, or a local `di` install over plain http).
map $http_x_forwarded_proto $dii_proto {
    default $scheme;
    "~*^(https|http)$" $http_x_forwarded_proto;
}

# The same image ships to production AND staging (docker-compose.staging.yml
# pulls the identical dii-client build, different tag), so "noindex staging"
# cannot be baked into a static file — it has to key on the request host at
# runtime. Empty on prod means the header is simply not sent: add_header
# skips headers whose value expands to an empty string.
map $host $dii_noindex {
    default "";
    "~*^staging\." "noindex, nofollow";
}

# Google indexed the site under www. alongside the apex (duplicate hosts,
# while og:url and the canonical link claim the apex). Caddy already routes
# www traffic to this container, so the redirect lives here — keyed on the
# host so it needs no hardcoded domain. Named capture: the apex is whatever
# follows the www. prefix.
map $host $dii_apex {
    default "";
    "~*^www\.(?<dii_apex_host>.+)$" $dii_apex_host;
}

server {
    # 8080, not 80 (audit #27): the container runs as a non-root user
    # (nginxinc/nginx-unprivileged), which can't bind a port below 1024.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # nginx builds every redirect it generates itself — a `rewrite ... permanent`,
    # the trailing-slash 301 for a directory — as an absolute URL from ITS OWN
    # scheme and port. Behind Caddy that is `http://<host>:8080/...`: the
    # container's internal port and a plain-http scheme, leaked to every client
    # that follows the hop. A relative `Location: /suite/` is what RFC 7231
    # allows and what every client resolves against the URL it actually used.
    absolute_redirect off;

    # www → apex, one hop, before anything else is considered. `if` at server
    # level with a plain `return` is one of the documented-safe uses. https is
    # correct even though this hop is plaintext: TLS terminates at Caddy, and
    # any www request necessarily arrived through it.
    if ($dii_apex) {
        return 301 https://$dii_apex$request_uri;
    }

    # Compression — text/code formats only; images, video, and glb/gltf
    # binaries are already compressed, so gzip'ing them wastes CPU.
    gzip on;
    gzip_min_length 1024;
    # Caddy fronts this container and adds a `Via` header, which is exactly how
    # nginx decides a request is proxied — and gzip_proxied defaults to `off`.
    # Without this line every HTML/JS/CSS response went out uncompressed in
    # production while the config above looked correct: three-vendor.js shipped
    # 1,614,468 B instead of 459,321 B. Verify after deploy with
    #   curl -sI -H 'Accept-Encoding: gzip' https://di-studio.xyz/assets/<chunk>.js
    # which must report `content-encoding: gzip`.
    gzip_proxied any;
    # Caches key on Accept-Encoding, so a compressed response is never served
    # to a client that did not ask for one.
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Security headers. The only CSP directive is frame-ancestors, which
    # governs who may FRAME these pages and touches no resource loading —
    # the app pulls user-authored code/WASM/3D assets from many origins and
    # a resource CSP is a separate task. X-Frame-Options cannot allow-list,
    # so it is gone: 'self' keeps the old rule, and the localhost:4748
    # origin lets the owner's di.desk frame staging and live pages.
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Empty (and therefore not sent) on prod, "noindex, nofollow" on any
    # staging.* host — see the $dii_noindex map above. Repeated in every
    # location below that sets its own add_header, same inheritance rule
    # as the security headers.
    add_header X-Robots-Tag $dii_noindex always;

    # WebSocket — must be matched before the broader /serverXR/ block
    location /serverXR/socket.io/ {
        proxy_pass http://server:4000/serverXR/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # WebSocket — the br_id_ge co-presence mesh (raw ws, not socket.io).
    # Prefix must survive: meshHub matches the full /serverXR/mesh path.
    location /serverXR/mesh {
        proxy_pass http://server:4000/serverXR/mesh;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Backend API
    location /serverXR/ {
        proxy_pass http://server:4000/serverXR/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dii_proto;
        proxy_read_timeout 60s;
        client_max_body_size 110m;
    }

    # Vite's hashed-output directory — filenames are content-hashed
    # (e.g. App-D68rdMZw.js), so a new build always gets new URLs and
    # these can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx only inherits server-level add_header when a location has
        # none of its own — since this block sets Cache-Control, the
        # security headers above must be repeated here or they're dropped.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    # public/brand/ became public/suite/ on 2026-09-02 (the owner's word, not
    # ours). The old path is already inside og:image tags that Telegram and
    # friends have scraped and cached, so it redirects rather than 404s.
    location ~ ^/brand(/|$) {
        rewrite ^/brand/?(.*)$ /suite/$1 permanent;
    }

    # SPA routes that collide with a real static-asset directory of the same
    # name (e.g. /wcc, served from public/wcc/) must still load the app --
    # otherwise try_files' $uri/ clause below matches the directory first and
    # nginx 403s (no index file, autoindex off) instead of falling through.
    # Mirrors the equivalent RewriteRule in .htaccess, the Apache/cPanel path.
    location ~ ^/wcc/?$ {
        # The crawler branch has to be repeated here. It lives in `location /`
        # below, and this block matches /wcc first — so the one exhibition with
        # its own doorway was the one space whose link previewed as the generic
        # platform tile, in every chat app, while /br_id_ge previewed correctly.
        # Verified on prod 2026-08-25: a Twitterbot fetch of /wcc returned the
        # 3548-byte SPA (identical to a human's) instead of the 984-byte card.
        if ($dii_crawler) {
            proxy_pass http://server:4000/serverXR/og$uri;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        # See /assets/ above: a location's own add_header suppresses the
        # server-level security headers unless repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    # The one-liner. These have to be exact-match blocks placed before the SPA
    # catch-all below, or /get returns index.html and `curl … | sh` pipes an
    # HTML page into a shell.
    #
    # text/plain so a browser shows the script instead of downloading it —
    # people do read this before running it, and should. Cacheable but short:
    # the URL goes on workshop handouts and outlives any one release, so it must
    # never be stale for long.
    location = /get {
        default_type text/plain;
        try_files /get.sh =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    location = /get.sh {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    location = /get.ps1 {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    # Crawler policy files — same story as /get above: exact-match blocks
    # placed before the SPA catch-all, or the crawler `if` / try_files
    # fallback below serves them as the app's index.html and bots parse HTML
    # where they expect a robots policy.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }

    # SPA — all other paths fall through to index.html
    location / {
        # Without these, proxy_pass sends `Host: server:4000` (nginx defaults
        # Host to $proxy_host), and the og route — which builds its absolute
        # URLs from the request — put `http://server:4000` into og:url, the
        # canonical link AND the meta refresh. A crawler then publishes, and may
        # cache, an address that exists only inside the compose network.
        #
        # These sit at location level rather than inside the `if`, because
        # proxy_set_header is not one of the directives nginx allows there. They
        # are inert for the try_files path below.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $dii_proto;
        proxy_set_header X-Forwarded-Host $host;

        # `if` is discouraged in nginx, but proxy_pass is one of the two uses
        # that is documented as safe inside it.
        if ($dii_crawler) {
            proxy_pass http://server:4000/serverXR/og$uri;
        }
        try_files $uri $uri/ /index.html;

        # index.html references the current hashed asset filenames, so it
        # must always be revalidated rather than cached long-term.
        add_header Cache-Control "no-cache" always;
        # See /assets/ above: a location's own add_header suppresses the
        # server-level security headers unless repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:4748" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag $dii_noindex always;
    }
}
