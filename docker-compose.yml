name: dii

# ─── Node 0 stack ──────────────────────────────────────────────────────────────
# Run locally:
#   cp .env.example .env
#   docker compose up --build -d
#
# Run with public Cloudflare Tunnel (no account needed):
#   docker compose --profile tunnel up --build -d
#   docker compose logs tunnel   ← grab the *.trycloudflare.com URL
#
# Run with a real domain + automatic HTTPS (a DNS A record already points
# the domain at this host -- Caddy gets and renews the cert itself, no
# Cloudflare account, no manual certbot):
#   echo "SITE_DOMAIN=your.domain" >> .env
#   echo "PORT=8080" >> .env   ← keeps client off host port 80 so Caddy can take it
#   docker compose --profile https up --build -d
#
# Modes:
#   Standalone  — no extra config, fully self-contained
#   Networked   — set FEDERATION_PEERS to connect to other nodes (coming soon)
# ───────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend: serverXR ────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: serverXR/Dockerfile
    volumes:
      - data:/data
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_BASE_PATH: /serverXR
      DATA_ROOT: /data

      # Auth — defaults to on since NODE_ENV is always production here;
      # set REQUIRE_AUTH=false in .env only for a deliberately open instance.
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-true}

      # Uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}

      # CORS — leave empty when client and server share the same nginx origin
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Google Drive import (all optional): API key unlocks public-folder
      # import; client id/secret + callback base enable per-user Drive connect.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-}

      # GitHub sign-in (optional): create an OAuth App at
      # https://github.com/settings/developers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # Sign in with Telegram (optional): di.bo mints the link, presenting
      # TELEGRAM_LOGIN_SECRET; the bot username feeds the web button's deep
      # link. Both unset = provider absent, routes never registered. Added
      # 2026-09-06: PR #282 wrote them to .env.example but never here, so the
      # secret sat in the host .env while the container never saw it.
      TELEGRAM_LOGIN_SECRET: ${TELEGRAM_LOGIN_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

      # GitHub App `dii-space-sync` (optional): one-click repo→space sync and
      # its push webhook. Distinct from the OAuth App above -- that one only
      # signs people in. Absent, `githubApp.isConfigured()` is false and the
      # whole feature reports `{configured: false}` instead of failing, which
      # is exactly how it went unnoticed for three weeks after the cPanel→VPS
      # move: the compose file that replaced the cPanel env never carried
      # these three vars over. The key is base64 (`base64 -w0 <key>.pem`) so
      # no loose .pem has to live on the host; _PATH is deliberately NOT
      # passed here, because getPrivateKey() prefers it and an empty one
      # would shadow the B64 value.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

      # Live co-presence mesh. The relay stays open -- visitors' browsers are
      # clients, so anything embedded in the public page is not a secret. This
      # only gates the reserved node ids (keeper-*), which is what stopped
      # anyone claiming the rite's keeper identity. Unset means those ids are
      # ungated, which is how it shipped; set a DIFFERENT value per tier.
      MESH_ROOM_SECRET: ${MESH_ROOM_SECRET:-}
      MESH_PROTECTED_NODE_PREFIXES: ${MESH_PROTECTED_NODE_PREFIXES:-}

      # The tunnel — inscriptionRoutes.js mints a Telegram deep link for the
      # person who can prove a crossing, and di.bo verifies it with the same
      # secret. Unset on either side means the route 404s and the tunnel simply
      # does not exist, which is the safe direction. Same lesson as the mesh
      # secret directly above: a secret the deployment cannot deliver is not a
      # secret it has, and the .env would have looked correct the whole time.
      TUNNEL_SHARED_SECRET: ${TUNNEL_SHARED_SECRET:-}
      TUNNEL_BOT_USERNAME: ${TUNNEL_BOT_USERNAME:-}

      # meshHub.js room history — unset keeps persistence OFF; switch on with
      # 'talk,keeper:say' only after the room's wording stops promising
      # impermanence (compose env is an allow-list: a var missing here never
      # reaches the container, however correct the .env looks — see #134).
      MESH_HISTORY_CHANNELS: ${MESH_HISTORY_CHANNELS:-}

      # approvalGate.js — see serverXR/.env.example. Unset (default
      # false/empty) leaves every gated route behaving exactly as before
      # this feature existed; staging overrides via STAGING_APPROVAL_*
      # (docker-compose.staging.yml) so the two tiers can be enabled
      # independently.
      APPROVAL_GATE_ENABLED: ${APPROVAL_GATE_ENABLED:-false}
      APPROVAL_BOT_URL: ${APPROVAL_BOT_URL:-}
      APPROVAL_SHARED_SECRET: ${APPROVAL_SHARED_SECRET:-}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to the
      # container's IPv6 loopback first and (unlike curl) never falls back
      # to IPv4 on connection refused -- see client/caddy below, where this
      # bug actually bit (nginx/Caddy admin API don't bind IPv6 loopback).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/serverXR/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Caps the default json-file driver, which has no size limit otherwise --
    # left unbounded, a long-running container's logs can fill a small VPS's
    # disk with nothing to prune them. Applied to every service below too.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Real ceiling: `cpus`/`mem_limit` at this top level are the pre-Swarm Compose keys,
    # applied directly by the Docker Engine on any Compose version (verified live via
    # `docker inspect` -- NanoCpus/Memory matched the old deploy.resources.limits values
    # exactly, so that mechanism was already being enforced too on this host's Compose
    # version; this syntax is just simpler/more universally compatible, not a bug fix).
    # Sized against the real 2 vCPU / 3.7GB Hetzner host (confirmed via `nproc`/`free -h`):
    # all five services summed to 3.1 against 2 actual vCPUs, trimmed proportionally to 1.8
    # (10% host headroom), keeping the same relative priority:
    # server > client ≈ caddy > staging-server > staging-client. Main workload, most headroom.
    cpus: '0.9'
    mem_limit: 1g

  # ── Frontend: nginx + React SPA ───────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = relative URLs, nginx proxies /serverXR/* to the server container.
        # Set only if client and server are on different origins.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      # Host side unchanged -- only the container-internal port moved to
      # 8080 (audit #27: non-root nginx can't bind below 1024).
      - "${PORT:-80}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost -- see server's healthcheck comment above.
      # Confirmed live (docker exec): `wget http://localhost/` gets connection
      # refused (nginx's `listen 80;` is IPv4-only, wget tries ::1 first and
      # doesn't fall back); `wget http://127.0.0.1/` succeeds. Port moved to
      # 8080 to match nginx's new non-root listen port (audit #27) -- if
      # nginxinc/nginx-unprivileged's alpine base doesn't ship wget the way
      # this was verified for plain nginx:alpine, this check will fail loud
      # (service never reports healthy) rather than silently proxying to a
      # container that isn't actually serving -- watch this on the very
      # first staging deploy after this change.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Real ceiling (see server's comment above for why top-level cpus/mem_limit, not
    # deploy.resources). nginx serving a static SPA is very light. Trimmed as part of the
    # host-wide CPU rebalance -- see server's comment above.
    cpus: '0.3'
    mem_limit: 128m

  # ── Cloudflare Tunnel — optional, profile: tunnel ─────────────────────────────
  # Exposes the stack publicly with no port forwarding or static IP.
  # Quick tunnel (no account): random *.trycloudflare.com URL, watch the logs.
  # Named tunnel (your domain): set CLOUDFLARE_TUNNEL_TOKEN in .env instead.
  tunnel:
    # Pinned by digest (audit #26) so this floating tag can't silently change
    # under us on the next `pull`; re-pin deliberately, see VPS_DOCKER_DEPLOY.md.
    image: cloudflare/cloudflared:latest@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    command: >
      tunnel --no-autoupdate
      ${CLOUDFLARE_TUNNEL_TOKEN:+run --token ${CLOUDFLARE_TUNNEL_TOKEN}}
      ${CLOUDFLARE_TUNNEL_TOKEN:---url http://client:8080}
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tunnel"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Real ceiling (see server's comment above). cloudflared is a lightweight relay process.
    # Alternative deployment mode to `caddy` below (mutually exclusive profiles), so it
    # isn't part of the same-host CPU budget those two are rebalanced against.
    cpus: '0.5'
    mem_limit: 128m

  # ── Caddy — optional, profile: https ──────────────────────────────────────────
  # Real domain + automatic Let's Encrypt HTTPS, no Cloudflare account needed.
  # Requires an A/AAAA record already pointing SITE_DOMAIN at this host, and
  # PORT set to something other than 80 in .env (see the run comment above)
  # so Caddy alone owns host ports 80/443.
  caddy:
    # Pinned by digest (audit #26) so this floating tag can't silently change
    # under us on the next `pull`; re-pin deliberately, see VPS_DOCKER_DEPLOY.md.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env to the domain pointing at this host}
      # Default lives here, not in the Caddyfile placeholder: compose's
      # environment: mapping always sets this key inside the container, even
      # when STAGING_DOMAIN is unset in .env (present-but-empty), and Caddy's
      # own {$VAR:default} placeholder only falls back when the var is fully
      # absent -- an empty value produces a keyless second server block,
      # which Caddy refuses to start (only the first block may be keyless).
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.invalid.internal}
      STAGING_PORT: ${STAGING_PORT:-8081}
      # A second, memorable door onto the SAME prod app and the SAME auth —
      # the map lane already lives behind ProtectedSurface at
      # /{space}/map/{project}; this only gives it its own name to hand out.
      # Same inert-until-DNS-exists pattern as STAGING_DOMAIN above.
      MAP_DOMAIN: ${MAP_DOMAIN:-map.invalid.internal}
    # Lets the Caddyfile's staging site block reach the staging Compose
    # project's client container by its host-published port, without
    # joining the two projects to a shared Docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Admin API only (loopback, not externally published) -- a liveness
      # check independent of TLS/domain config, so it can't false-negative
      # on an inert STAGING_DOMAIN block with no DNS yet (see the comment above).
      # 127.0.0.1, not localhost -- see server's healthcheck comment above.
      # Confirmed live (docker exec): Caddy's admin API only binds the IPv4
      # loopback, so `wget http://localhost:2019/` (which tries ::1 first
      # and doesn't fall back) gets connection refused; 127.0.0.1 succeeds.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles: ["https"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Real ceiling (see server's comment above for why top-level cpus/mem_limit, not
    # deploy.resources). TLS termination is light. Trimmed as part of the host-wide CPU
    # rebalance -- see server's comment above.
    cpus: '0.3'
    mem_limit: 128m

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  data:
    # SQLite DB + uploaded assets — the node's sovereign data store.
    # Back it up with: docker run --rm -v dii_data:/data -v $(pwd):/backup alpine tar czf /backup/data-backup.tar.gz /data
  caddy_data:
    # Let's Encrypt certs + account key — keep across restarts to avoid rate limits.
  caddy_config:
