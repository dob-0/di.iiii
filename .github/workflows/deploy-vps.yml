name: Deploy VPS (GHCR + SSH)

# Golden-path production deploy: Hetzner VPS Docker Compose stack, DNS fully
# cut over from cPanel. cPanel (publish-cpanel-prebuilt-v2.yml) is disabled
# (workflow_dispatch-only) and kept only as a documented fallback until its
# hosting term expires; see docs/deploy/VPS_DOCKER_DEPLOY.md.
#
# Only `main` (production) is wired up here. `dev` (staging) deploys via
# deploy-vps-staging.yml, same VPS, isolated as a separate Compose project.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dii-server
            dockerfile: serverXR/Dockerfile
          - image: dii-client
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check SSH deploy configuration
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_SSH_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          if [ -z "${VPS_DEPLOY_PATH:-}" ]; then
            echo "::error::Missing required repository variable: VPS_DEPLOY_PATH (path to the docker-compose checkout on the VPS)"
            missing=1
          fi
          exit "${missing}"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Pull and restart the stack on the VPS
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_SSH_PORT:-22}"
          REMOTE="${VPS_SSH_USER}@${VPS_HOST}"
          SSH=(ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes "${REMOTE}")

          "${SSH[@]}" "REGISTRY_USER=$(printf '%q' "${REGISTRY_USER}") IMAGE_TAG=$(printf '%q' "${GITHUB_SHA}") DEPLOY_PATH=$(printf '%q' "${VPS_DEPLOY_PATH}") bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          export REGISTRY_USER
          export IMAGE_TAG

          # Keep the deploy-relevant tracked config files in sync with the
          # exact commit being deployed. Everything else on this checkout
          # (.env, data volumes, etc.) is untouched.
          git fetch --quiet origin
          git checkout --quiet "${IMAGE_TAG}" -- docker-compose.yml docker-compose.prod.yml docker-compose.caddy-hardened.yml Caddyfile

          COMPOSE_FILES=(-f docker-compose.yml -f docker-compose.prod.yml)
          if [ -f docker-compose.caddy-hardened.yml ]; then
            COMPOSE_FILES+=(-f docker-compose.caddy-hardened.yml)
          fi
          docker compose --profile https "${COMPOSE_FILES[@]}" pull
          docker compose --profile https "${COMPOSE_FILES[@]}" up -d
          # Caddyfile is a read-only bind mount -- content-only edits don't
          # trigger a recreate on their own, so reload it explicitly.
          docker compose --profile https "${COMPOSE_FILES[@]}" exec -T caddy caddy reload --config /etc/caddy/Caddyfile --force || \
            docker compose --profile https "${COMPOSE_FILES[@]}" restart caddy
          REMOTE_SCRIPT

      - name: Smoke check
        env:
          SMOKE_BASE_URL: ${{ vars.VPS_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "::warning::VPS_BASE_URL repository variable not set — skipping smoke check. Set it to run scripts/smoke-check.mjs against the deployed host."
            exit 0
          fi
          # Reusing scripts/smoke-check.mjs as-is: its checks (frontend
          # root, /serverXR/api/health, etc.) are generic over --base-url and
          # not cPanel-specific. Follow-up: rename/generalize it once the
          # cPanel path is retired.
          node scripts/smoke-check.mjs --base-url "${SMOKE_BASE_URL}"
