# The stranger's-machine test.
#
# Everything else in CI checks the code. This checks the thing an artist
# actually does: paste one line onto a machine that has never seen di.iiii.
# Every job below is a genuinely clean root filesystem and HOME.
#
# The three bugs this was written after all had one thing in common — the unit
# tests were green and the product did not work. A hidden install directory
# 404'd the whole app, a vendored node had no npm beside it, and nodejs.org has
# no musl build. None of those are visible from inside the repo.

name: install matrix

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/di/**'
      - 'scripts/pack-runtime.mjs'
      - 'serverXR/src/index.js'
      - 'serverXR/src/config.js'
      - '.github/workflows/install-matrix.yml'
  push:
    branches: [dev, main]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/di/**'
      - 'scripts/pack-runtime.mjs'
  workflow_dispatch:

jobs:
  pack:
    name: pack the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run di:pack
      - uses: actions/upload-artifact@v7
        with:
          name: di-runtime
          path: dist-runtime/
          retention-days: 3

  linux:
    name: ${{ matrix.name }}
    needs: pack
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No node, no docker — exercises the vendored-node path end to end.
          - { name: 'debian 12', image: 'debian:12', prep: 'apt-get update -qq && apt-get install -y -qq curl ca-certificates' }
          - { name: 'ubuntu 24.04', image: 'ubuntu:24.04', prep: 'apt-get update -qq && apt-get install -y -qq curl ca-certificates' }
          - { name: 'fedora 40', image: 'fedora:40', prep: 'dnf install -y -q curl' }
          # busybox ash + musl. This is the job that catches bashisms, and the
          # one that found nodejs.org's missing musl build. libstdc++/libgcc are
          # what the musl node needs — the installer says so when they are
          # absent, and this proves the sentence it prints is true.
          - { name: 'alpine 3.20 (musl)', image: 'alpine:3.20', prep: 'apk add --no-cache curl bash libstdc++ libgcc' }
          # A node that is present but below the floor: must download its own
          # rather than boot and die on node:sqlite.
          - { name: 'node 20 (too old)', image: 'node:20-bookworm', prep: 'true' }
          - { name: 'node 22 (happy path)', image: 'node:22-bookworm', prep: 'true' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: di-runtime
          path: dist-runtime

      - name: prepare the machine
        run: ${{ matrix.prep }}

      - name: install
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo '')
          if [ -z "$VERSION" ]; then VERSION=$(ls dist-runtime/di-runtime-*.tar.gz | sed 's/.*di-runtime-\(.*\)\.tar\.gz/\1/'); fi
          DI_INSTALL_ARTIFACT="dist-runtime/di-runtime-$VERSION.tar.gz" \
          DI_INSTALL_VERSION="$VERSION" \
          DI_NO_COLOR=1 sh install.sh

      # A fresh login shell is the real PATH test. Running the shim by absolute
      # path proves only that the file exists.
      - name: di works in a fresh login shell
        shell: bash -l {0}
        run: |
          set -eu
          di version
          di up --port 4300 --no-open
          di status

      - name: the app is actually served, not just the API
        run: |
          set -eu
          curl -fsS -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:4300/serverXR/api/health
          curl -fsS http://127.0.0.1:4300/main | grep -q 'id="root"' || { echo 'GET /main did not return the app'; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:4300/studio

      - name: down releases the port
        shell: bash -l {0}
        run: |
          set -eu
          di down
          if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:4300/serverXR/api/health; then
            echo 'still listening after di down'; exit 1
          fi

      - name: uninstall keeps the work
        shell: bash -l {0}
        run: |
          set -eu
          di uninstall
          test ! -e "$HOME/.di/bin/di" || { echo 'the binary survived uninstall'; exit 1; }
          test -d "$HOME/.di/data" || { echo 'uninstall deleted the artist work'; exit 1; }

  update:
    # `di update` makes exactly one promise — it never touches your work — and a
    # promise about data needs a test that can fail. This installs a version,
    # puts a canary space in it, updates onto a second version, and asserts the
    # canary came through byte for byte. Then rolls back and asserts it again.
    name: update keeps the work (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    # A hang is a failure. Without this, `di up` not returning cost a six-hour job.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows is here on purpose. Its update path has failure modes the unix
        # one does not — `current` is a junction, and removing a junction the
        # wrong way removes what it points at — so it has to be exercised on
        # every change, or it drifts until the day someone actually runs it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: di-runtime
          path: dist-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Two artifacts from one build: same bytes, different version numbers.
      # Enough to exercise stage → verify → smoke-test → flip → rollback.
      - name: make a second version to update onto
        shell: bash
        run: |
          set -eu
          V=$(node -p "require('./package.json').version")
          cp "dist-runtime/di-runtime-$V.tar.gz" "dist-runtime/di-runtime-9.9.9.tar.gz"
          echo "BASE_VERSION=$V" >> "$GITHUB_ENV"

      - name: install the older version
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            DI_INSTALL_ARTIFACT="dist-runtime/di-runtime-$BASE_VERSION.tar.gz" \
            DI_INSTALL_VERSION="$BASE_VERSION" pwsh ./install.ps1
          else
            DI_INSTALL_ARTIFACT="dist-runtime/di-runtime-$BASE_VERSION.tar.gz" \
            DI_INSTALL_VERSION="$BASE_VERSION" DI_NO_COLOR=1 sh install.sh
          fi

      - name: leave a canary in the artist's work
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then DI="$HOME/.di/bin/di.cmd"; else DI="$HOME/.di/bin/di"; fi
          "$DI" up --port 4310 --no-open
          curl -fsS -X POST http://127.0.0.1:4310/serverXR/api/spaces \
            -H 'Content-Type: application/json' \
            -d '{"label":"Canary","slug":"canary"}' -o /dev/null
          # A di install requires a scene precondition (428 without one) — state
          # the version this write is based on, the way any honest caller must.
          BASE=$(curl -fsS http://127.0.0.1:4310/serverXR/api/spaces/canary/scene \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version ?? 0')
          curl -fsS -X PUT "http://127.0.0.1:4310/serverXR/api/spaces/canary/scene?baseVersion=$BASE" \
            -H 'Content-Type: application/json' \
            -d '{"version":4,"objects":[],"metadata":{"canary":"do-not-lose-me"}}' -o /dev/null
          curl -fsS http://127.0.0.1:4310/serverXR/api/spaces/canary/scene > canary-before.json
          grep -q 'do-not-lose-me' canary-before.json
          "$DI" down

      # No release feed in CI, so drive the same code path directly rather than
      # a fake `di update` that would prove something else.
      - name: update onto 9.9.9
        shell: bash
        run: |
          set -eu
          node -e "
            const path = require('node:path')
            const url = (p) => require('node:url').pathToFileURL(p).href
            ;(async () => {
              const install = await import(url(path.resolve('scripts/di/install.mjs')))
              const nodeRunner = await import(url(path.resolve('scripts/di/runner-node.mjs')))
              const home = path.join(require('node:os').homedir(), '.di')
              const staged = await install.stageVersion({ home, release: {
                version: '9.9.9',
                url: url(path.resolve('dist-runtime/di-runtime-9.9.9.tar.gz')),
                checksumsUrl: null
              }})
              const ok = await install.smokeTest({ home, versionDir: staged.partialDir, nodeBinary: nodeRunner.nodeBinary(home) })
              if (!ok) throw new Error('the staged version did not answer on a scratch port')
              await install.activate({ home, ...staged, version: '9.9.9', mode: 'node' })
              console.log('activated 9.9.9')
            })().catch((error) => { console.error(error); process.exit(1) })
          "

      - name: the canary survived the update
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then DI="$HOME/.di/bin/di.cmd"; else DI="$HOME/.di/bin/di"; fi
          test "$("$DI" version)" = "9.9.9"
          "$DI" up --port 4311 --no-open
          curl -fsS http://127.0.0.1:4311/serverXR/api/spaces/canary/scene > canary-after.json
          diff canary-before.json canary-after.json || { echo 'the update changed the artist work'; exit 1; }
          "$DI" down

      - name: rollback, and it survives that too
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then DI="$HOME/.di/bin/di.cmd"; else DI="$HOME/.di/bin/di"; fi
          "$DI" update --rollback
          test "$("$DI" version)" = "$BASE_VERSION"
          "$DI" up --port 4312 --no-open
          curl -fsS http://127.0.0.1:4312/serverXR/api/spaces/canary/scene > canary-rollback.json
          diff canary-before.json canary-rollback.json || { echo 'the rollback changed the artist work'; exit 1; }
          "$DI" down

      # The junction trap, asserted directly: `current` must be a link, and the
      # version it points at must still be whole after all of the above.
      - name: current is still a link, not a copy
        shell: bash
        run: |
          set -eu
          node -e "
            const fs = require('node:fs'), path = require('node:path'), os = require('node:os')
            const current = path.join(os.homedir(), '.di', 'current')
            const st = fs.lstatSync(current)
            if (!st.isSymbolicLink()) throw new Error('current is not a link — a junction was replaced by a copy')
            const target = fs.realpathSync(current)
            for (const f of ['dist/index.html', 'serverXR/src/index.js', 'cli/cli.mjs']) {
              if (!fs.existsSync(path.join(target, f))) throw new Error('missing after link churn: ' + f)
            }
            console.log('current -> ' + target)
          "

  offline:
    # Offline-first is the whole claim. It needs a test that fails when it stops
    # being true, not a sentence in a README.
    name: works with the network unplugged
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: di-runtime
          path: dist-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install with the network
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          DI_INSTALL_ARTIFACT="dist-runtime/di-runtime-$VERSION.tar.gz" \
          DI_INSTALL_VERSION="$VERSION" DI_NO_COLOR=1 sh install.sh

      - name: then take it away
        run: |
          set -eu

          # The work, in a file — three levels of nested shell quoting is its own
          # source of false failures.
          cat > /tmp/offline-check.sh <<'SCRIPT'
          set -eu
          di up --port 4301 --no-open
          curl -fsS http://127.0.0.1:4301/main | grep -q 'id="root"'
          # The SPA shell above is served for ANY route — including the auth
          # wall — so it proves the server is up, not that the install is
          # usable. This is the assertion that means something: a local
          # install answers with auth off, i.e. the artist owns the door.
          curl -fsS http://127.0.0.1:4301/serverXR/api/auth/session | grep -q '"requireAuth":false'
          curl -fsS -o /dev/null http://127.0.0.1:4301/serverXR/api/spaces
          di down
          echo "served with no network"
          SCRIPT
          chmod +x /tmp/offline-check.sh

          cat > /tmp/offline-outer.sh <<'SCRIPT'
          set -eu
          # A fresh network namespace HAS a loopback interface, but it is DOWN, so
          # 127.0.0.1 is unreachable and the failure reads as "the server never
          # started". Bring lo up while still root, THEN drop privileges — the
          # other order fails silently and the job proves nothing.
          ip link set lo up
          exec sudo -u "$TARGET_USER" \
            env "HOME=$TARGET_HOME" "PATH=$TARGET_HOME/.di/bin:$PATH" DI_NO_COLOR=1 \
            bash /tmp/offline-check.sh
          SCRIPT

          # Proves there is no route off this machine — if anything here can still
          # reach the internet, the job is not testing what it claims.
          sudo unshare -n -- bash -c 'ip link set lo up; curl -sS --max-time 5 https://nodejs.org >/dev/null 2>&1 && { echo "namespace still has network — this job proves nothing"; exit 1; }; echo "confirmed: no route out"'

          sudo TARGET_USER="$USER" TARGET_HOME="$HOME" unshare -n -- bash /tmp/offline-outer.sh

  windows:
    name: windows
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: di-runtime
          path: dist-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version")
          $env:DI_INSTALL_ARTIFACT = "dist-runtime/di-runtime-$version.tar.gz"
          $env:DI_INSTALL_VERSION = $version
          ./install.ps1

      - name: di runs, serves, and stops
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.di\bin;$env:Path"
          di version
          di up --port 4302 --no-open
          $body = (Invoke-WebRequest -Uri http://127.0.0.1:4302/main -UseBasicParsing).Content
          if ($body -notmatch 'id="root"') { throw 'GET /main did not return the app' }
          di down

  docker-mode:
    # Runs on the host runner, which has a real daemon. Self-skips while the
    # GHCR packages are private — and that skip line is the reminder to make
    # them public.
    name: docker mode
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: are the images public yet?
        id: images
        run: |
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:dob-0/dii-server:pull&service=ghcr.io" | jq -r .token 2>/dev/null || echo '')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            https://ghcr.io/v2/dob-0/dii-server/manifests/latest)
          echo "public=$([ "$code" = 200 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          if [ "$code" != 200 ]; then
            echo "::notice::ghcr.io/dob-0/dii-server is not anonymously pullable ($code) — docker mode skipped. Make the package public to enable it."
          fi

      - name: bring the stack up
        if: steps.images.outputs.public == 'yes'
        run: |
          set -eu
          docker compose -p di-ci -f docker-compose.yml -f docker-compose.di.yml up -d
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:4000/serverXR/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/ | grep -q 'id="root"'
          docker compose -p di-ci -f docker-compose.yml -f docker-compose.di.yml down
