name: Release Bundles

on:
  push:
    tags:
      - 'v*'
  # Called by tag-on-promotion.yml. A tag pushed by a workflow using
  # GITHUB_TOKEN does NOT trigger `on: push: tags` — that is a deliberate
  # GitHub rule against workflows retriggering each other, and it would leave
  # every automatic tag with no artifact behind it. So the tagger calls this
  # workflow directly instead of hoping the tag does.
  workflow_call:
    inputs:
      version:
        description: 'Version to build and release, without the leading v'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          if [ -f serverXR/package-lock.json ]; then
            npm --prefix serverXR ci
          else
            npm --prefix serverXR install
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The artifact `curl … /get | sh` installs — FIRST, because it is the one
      # thing a release must produce. It used to sit behind a legacy bundle step
      # the repo moved off in July 2026, which could stop a release outright:
      # v0.2.1 and v0.3.0 both died there and published nothing.
      #
      # Built from the tag rather than package.json so the filename always
      # matches the tag the installer resolves from the release feed — a
      # mismatch there is a 404 for every person who pastes the line.
      # A local install is same-origin, so this build sets no VITE_API_BASE_URL.
      - name: Pack the di runtime
        env:
          # The tag when a human pushed one, the input when the promotion
          # tagger called us. Never package.json, which is not the released
          # number and has been 0.2.0 since v0.2.0.
          DI_RELEASE_VERSION: ${{ inputs.version || '' }}
        run: |
          VERSION="${DI_RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "packing $VERSION"
          npm run di:pack -- --version="$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Named explicitly, because on a workflow_call the ref is a branch and
          # the action would otherwise try to release from it.
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          # Both files are always produced by the pack step above, so a missing
          # one means the artifact people install is missing: fail loudly.
          fail_on_unmatched_files: true
          files: |
            dist-runtime/di-runtime-*.tar.gz
            dist-runtime/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
