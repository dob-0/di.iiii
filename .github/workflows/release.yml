name: Release Bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          if [ -f serverXR/package-lock.json ]; then
            npm --prefix serverXR ci
          else
            npm --prefix serverXR install
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Stage cPanel release
        env:
          VITE_API_BASE_URL: /serverXR
        run: npm run deploy:cpanel

      - name: Zip dist
        run: |
          cd .deploy/cpanel/public_html
          zip -r ../../../dist.zip .

      - name: Zip cPanel release
        run: |
          cd .deploy/cpanel
          zip -r ../../cpanel-release.zip .

      # The artifact `curl … /get | sh` installs. Built from the tag rather than
      # package.json so the filename always matches the tag the installer
      # resolves from the release feed — a mismatch there is a 404 for every
      # person who pastes the line.
      # Its own build, not the cPanel one: that step sets VITE_API_BASE_URL for
      # a different topology, and a local install is same-origin.
      - name: Pack the di runtime
        run: npm run di:pack -- --version=${GITHUB_REF_NAME#v}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist.zip
            cpanel-release.zip
            dist-runtime/di-runtime-*.tar.gz
            dist-runtime/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
