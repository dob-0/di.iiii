name: Release Bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          if [ -f serverXR/package-lock.json ]; then
            npm --prefix serverXR ci
          else
            npm --prefix serverXR install
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The artifact `curl … /get | sh` installs — FIRST, because it is the one
      # thing a release must produce. It used to sit behind the cPanel bundle
      # below, so a legacy path the repo moved off in July 2026 could stop a
      # release outright: v0.2.1 and v0.3.0 both died there and published nothing.
      #
      # Built from the tag rather than package.json so the filename always
      # matches the tag the installer resolves from the release feed — a
      # mismatch there is a 404 for every person who pastes the line.
      # Its own build, not the cPanel one: that step sets VITE_API_BASE_URL for
      # a different topology, and a local install is same-origin.
      - name: Pack the di runtime
        run: npm run di:pack -- --version=${GITHUB_REF_NAME#v}

      # Legacy: deploy moved to the VPS on 2026-07-15 (docs/deploy/LIVE_DEPLOY.md).
      # These bundles are a fallback nobody currently uses, and the step never
      # received VITE_API_TOKEN in the first place, so it could only ever fail.
      # Kept, but they can no longer take the release down with them.
      - name: Can the legacy cPanel bundle be built
        id: cpanel
        env:
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
        run: |
          if [ -n "${VITE_API_TOKEN:-}" ]; then
            echo 'possible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'possible=false' >> "$GITHUB_OUTPUT"
            echo '::notice::VITE_API_TOKEN is not set - skipping the legacy cPanel bundles. The di runtime artifact is unaffected.'
          fi

      - name: Stage cPanel release
        if: steps.cpanel.outputs.possible == 'true'
        env:
          VITE_API_BASE_URL: /serverXR
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
        run: npm run deploy:cpanel

      - name: Zip dist
        if: steps.cpanel.outputs.possible == 'true'
        run: |
          cd .deploy/cpanel/public_html
          zip -r ../../../dist.zip .

      - name: Zip cPanel release
        if: steps.cpanel.outputs.possible == 'true'
        run: |
          cd .deploy/cpanel
          zip -r ../../cpanel-release.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The cPanel zips are skipped whenever the legacy secret is absent, so
          # their patterns match nothing on a normal release. That must not fail
          # the upload of the artifact people actually install.
          fail_on_unmatched_files: false
          files: |
            dist.zip
            cpanel-release.zip
            dist-runtime/di-runtime-*.tar.gz
            dist-runtime/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
