name: Publish cPanel Release

# Auto-trigger on push removed 2026-07-15: production DNS fully cut over to
# the VPS (Docker/Caddy), and this pipeline's smoke-check has been failing
# every run since (the cPanel host's release.gitCommit stays null, so the
# "wait for expected SHA" step always times out) while burning CI minutes
# for a fallback host real traffic no longer reaches. Kept as
# workflow_dispatch only — run manually if cPanel is ever needed again.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or ref to build from
        required: false
        default: ''
      deploy_env:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: write

jobs:
  # Deploys wait for the behavioral browser checks (input-device contracts,
  # responsive sweep) — the suite unit tests can't cover. A red check means
  # nothing reaches staging or production.
  checks:
    uses: ./.github/workflows/browser-checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'main' || inputs.deploy_env == 'production') && 'production' || 'staging' }}
    env:
      SOURCE_REF:    ${{ inputs.source_ref != '' && inputs.source_ref || github.ref_name }}
      DEPLOY_ENV:    ${{ (github.ref_name == 'main' || inputs.deploy_env == 'production') && 'production' || 'staging' }}
      TARGET_BRANCH: ${{ (github.ref_name == 'main' || inputs.deploy_env == 'production') && 'cpanel-production' || 'cpanel-staging' }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
      source_sha: ${{ steps.publish.outputs.source_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check cPanel backend compatibility
        run: node scripts/check-cpanel-compat.mjs --deploy-env "${DEPLOY_ENV}"

      - name: Install server dependencies
        run: npm --prefix serverXR ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Stage release
        env:
          VITE_API_BASE_URL: /serverXR
          VITE_API_TOKEN: ${{ secrets.SERVERXR_API_TOKEN }}
        run: node scripts/stage-cpanel-nodeapp-release.mjs

      - name: Publish to ${{ env.TARGET_BRANCH }}
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          CONTENT_DIR="$(mktemp -d)"
          BRANCH_DIR="$(mktemp -d)"

          rsync -az \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='serverXR/node_modules' \
            --exclude='dist' \
            --exclude='.deploy' \
            ./ "${CONTENT_DIR}/"

          mkdir -p "${CONTENT_DIR}/.deploy"
          cp -R .deploy/cpanel "${CONTENT_DIR}/.deploy/cpanel"
          cp deploy/cpanel/cpanel.prebuilt.yml "${CONTENT_DIR}/.cpanel.yml"
          rm -f "${CONTENT_DIR}/deploy/cpanel/cpanel.prebuilt.yml"
          printf '%s\n' "${SOURCE_REF}" > "${CONTENT_DIR}/.cpanel-source-ref"
          printf '%s\n' "${DEPLOY_ENV}" > "${CONTENT_DIR}/.cpanel-deploy-env"

          cd "${BRANCH_DIR}"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin "${TARGET_BRANCH}"; then
            git checkout -B "${TARGET_BRANCH}" FETCH_HEAD
            git rm -r --ignore-unmatch .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout --orphan "${TARGET_BRANCH}"
          fi

          rsync -az "${CONTENT_DIR}/" ./
          git add -A .
          git add -f .deploy .cpanel.yml .cpanel-source-ref .cpanel-deploy-env
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish ${DEPLOY_ENV} cPanel prebuilt from ${SOURCE_REF}"
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  # After a real publish, wait for cPanel to pull the release (health endpoint
  # reports release.gitCommit) and smoke-check the live origin. A broken deploy
  # turns the run red instead of waiting for a person to notice.
  smoke:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ (github.ref_name == 'main' || inputs.deploy_env == 'production') && 'https://di-studio.xyz' || 'https://staging.di-studio.xyz' }}
      EXPECTED_SHA: ${{ needs.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for the release to go live (10 min max)
        run: |
          echo "waiting for ${BASE_URL} to report ${EXPECTED_SHA}"
          for i in $(seq 1 60); do
            live=$(curl -sf --max-time 10 "${BASE_URL}/serverXR/api/health" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).release.gitCommit||"")}catch{console.log("")}})' || true)
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "release is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::deploy never went live with ${EXPECTED_SHA} (last seen: ${live:-none})"
          exit 1

      - name: Smoke check
        run: node scripts/smoke-check.mjs --base-url "${BASE_URL}"
