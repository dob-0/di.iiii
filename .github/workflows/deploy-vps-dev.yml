name: Deploy VPS Dev (GHCR + SSH)

# The dev tier's deploy path: `dev` -> https://dev.diiii.xyz.
# Same VPS as production, a separate low-resource Compose project
# (docker-compose.dev.yml) in its own checkout directory so it never
# inherits production's COMPOSE_PROFILES=https or secrets. See
# docs/deploy/VPS_DOCKER_DEPLOY.md for the one-time host setup (second
# checkout dir, its own .env, Caddyfile's dev-tier site block).

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Fold the session notes a merge just brought onto dev (`npm run land`, the
  # step a human used to have to remember) and push the result back, so dev
  # ends every merge in the landed state its own docs gate demands. Before
  # this, 82 of the last 111 merges (14 days to 2026-09-02) needed a hand-run
  # fold commit before the dev tier would update.
  #
  # Why this cannot loop or double-deploy: a push made with GITHUB_TOKEN never
  # triggers another workflow run (GitHub's own rule against workflows
  # retriggering each other -- the same one tag-on-promotion.yml works
  # around). So the fold commit does NOT start a second dev-tier deploy, and
  # THIS run has to be the one that deploys. It deploys github.sha, the merge
  # commit: the fold only ever touches PROGRESS.md, CURRENT.md and
  # docs/ai/sessions/, so the image built from the merge commit is the image
  # the fold commit would produce -- release.gitCommit reports the merge sha,
  # one commit behind dev's tip, and that is accepted on purpose.
  #
  # Why the deploy does not depend on the push succeeding: dev has classic
  # branch protection with required status checks and no bypass for GitHub
  # Actions. A fresh fold commit can't carry those checks, so the push may be
  # rejected (GH006). That is a warning here, not a failure -- `test` folds
  # its own checkout in place (ci.yml's land_in_place) so the docs check
  # passes and the dev tier deploys either way; the only thing lost is the
  # bookkeeping commit, which `npm run land` still does by hand.
  # continue-on-error keeps a crash in this job from blocking the deploy too.
  #
  # Concurrency: the workflow-level group above already serialises whole runs,
  # so two merges minutes apart never fold at the same time. If dev still
  # moved under us between fold and push, we re-fold from the new tip rather
  # than rebasing a stale fold onto it (a rebase could leave a newly merged
  # note unfolded); bounded to three tries.
  land:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      # ref: dev, not github.sha -- we push on top of whatever dev is NOW, and
      # this leaves a real local `dev` branch behind, which session-land.mjs
      # requires (it refuses a detached HEAD). Shallow is fine: the scripts
      # need no history and pushing one new commit needs none either.
      - name: Checkout dev tip
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      # No npm ci: session-land.mjs and repo-state.mjs import only node
      # builtins and their sibling libs.
      - name: Fold session notes and push
        if: github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --quiet origin dev
            git switch --quiet -C dev origin/dev
            before=$(git rev-parse HEAD)

            node scripts/session-land.mjs

            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "docs/ai/sessions/ already empty on dev -- nothing to fold."
              exit 0
            fi

            if out=$(git push origin HEAD:refs/heads/dev 2>&1); then
              echo "$out"
              echo "::notice::Folded session notes into dev: $(git log -1 --format=%s)"
              exit 0
            fi
            echo "$out"

            if grep -qiE 'GH006|protected branch' <<<"$out"; then
              echo "::warning::dev's branch protection rejected the fold commit (required status checks, no bypass for GitHub Actions). The dev tier still deploys -- the test job folds in place -- but the bookkeeping commit did not land: run 'npm run land' on dev by hand, or give the github-actions app a bypass on dev's rules so this job can do it."
              exit 0
            fi
            echo "push rejected on attempt ${attempt} -- dev moved; re-folding from its new tip."
          done

          echo "::error::could not push the fold commit after 3 attempts; run 'npm run land' on dev by hand."
          exit 1

  # Gate on the same test/lint/build/contract suite CI runs on every push —
  # previously this workflow and ci.yml were independent, so a failing test
  # suite did not block a dev-tier deploy either (audit 2026-07-17).
  # After `land`, not alongside it: one writer on dev at a time, and the
  # fold's outcome (notice or warning) is on the run before anything deploys.
  # The checks themselves run on github.sha, the merge commit, folded in place
  # (land_in_place -- see the comment on `land`), so they pass whether or not
  # `land` could push. Only on dev: a workflow_dispatch from another ref
  # checks out that ref, and session-land.mjs refuses anything but dev.
  test:
    needs: land
    uses: ./.github/workflows/ci.yml
    with:
      land_in_place: ${{ github.ref == 'refs/heads/dev' }}
    permissions:
      contents: read

  # The dev channel (docs/architecture/decisions/2026-10-05-release-channels.md):
  # one GitHub PRERELEASE per green dev commit, tagged dev-<sha8>, carrying the
  # runtime tarball and its sha256. Installs on the dev channel take the one the
  # hub is serving (`di update --channel dev`). Needs only `test`, not the
  # deploy: the artifact is a property of the commit, and an install gates on the
  # hub's own health anyway. Never "latest", never touches stable releases;
  # keeps the newest 20 dev-* prereleases and deletes the rest.
  publish-dev-channel:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KEEP_DEV_RELEASES: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix serverXR ci

      - name: Pack the runtime for this commit
        id: pack
        run: |
          set -euo pipefail
          SHA8="${GITHUB_SHA:0:8}"
          # Next patch after the newest stable tag, plus -dev.<sha8>: sorts above
          # the stable it follows and below the one it becomes.
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$LAST" ]; then
            IFS=. read -r MA MI PA <<<"${LAST#v}"
            BASE="${MA}.${MI}.$((PA + 1))"
          else
            BASE=$(node -p "require('./package.json').version")
          fi
          VERSION="${BASE}-dev.${SHA8}"
          echo "sha8=${SHA8}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm run di:pack -- --version="${VERSION}"
          # The channel refuses an artifact it cannot verify; verify it here too.
          (cd dist-runtime && sha256sum -c checksums.txt)

      - name: Publish the dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA8: ${{ steps.pack.outputs.sha8 }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          TAG="dev-${SHA8}"
          # A re-run of the same commit replaces its own release, nothing else.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "dev ${SHA8} (${VERSION})" \
            --notes "Dev-channel build of ${GITHUB_SHA}. Installed by \`di update --channel dev\` only when dev.diiii.xyz serves this commit. Not a stable release." \
            "dist-runtime/di-runtime-${VERSION}.tar.gz" dist-runtime/checksums.txt

      - name: Keep the newest dev prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Newest first by creation time; only dev-<8 hex> tags are ever deleted.
          gh release list --limit 200 --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^dev-[0-9a-f]{8}$")))] | sort_by(.createdAt) | reverse | .['"${KEEP_DEV_RELEASES}"':] | .[].tagName' \
            | while read -r tag; do
                echo "deleting old dev release ${tag}"
                gh release delete "$tag" --cleanup-tag --yes
              done

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: dii-server
            dockerfile: serverXR/Dockerfile
          - image: dii-client
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build timestamp
        id: time
        run: echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:dev-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:dev
          # release.json is baked in by serverXR/Dockerfile only -- the client's Dockerfile
          # doesn't declare these ARGs, so build-push-action just passes them through unused.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            DEPLOY_ENV=dev
            BUILD_TIME=${{ steps.time.outputs.utc }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: dev
    env:
      # Where this tier runs: `vps` (the Docker Compose host over SSH, the default, so this
      # variable unset changes nothing) or `mac` (a host that PULLS its deploys). With `mac` this
      # job still runs under its environment (dev) and its rules, so the gate is unchanged;
      # it skips SSH and ends green, and that green run IS the go: the host's pull-deployer builds
      # and runs a commit only once this job has succeeded for it, and only one on origin/dev.
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'vps' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      VPS_DEV_DEPLOY_PATH: ${{ vars.VPS_DEV_DEPLOY_PATH }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    steps:
      - name: Deploy target
        run: |
          set -euo pipefail
          case "${DEPLOY_TARGET}" in
            vps) echo "deploy target: vps (SSH to the Compose host)" ;;
            mac) echo "::notice::deploy target: mac -- no SSH. This run's success releases ${GITHUB_SHA} to the host's pull-deployer, which builds it, switches, health-checks and rolls back by itself." ;;
            *) echo "::error::repository variable DEPLOY_TARGET is '${DEPLOY_TARGET}'; it must be vps or mac"; exit 1 ;;
          esac

      - name: Checkout
        if: env.DEPLOY_TARGET == 'vps'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SSH deploy configuration
        if: env.DEPLOY_TARGET == 'vps'
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_SSH_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          if [ -z "${VPS_DEV_DEPLOY_PATH:-}" ]; then
            echo "::error::Missing required repository variable: VPS_DEV_DEPLOY_PATH (path to the SEPARATE dev-tier docker-compose checkout on the VPS -- not the production one, see docs/deploy/VPS_DOCKER_DEPLOY.md)"
            missing=1
          fi
          exit "${missing}"

      - name: Configure SSH
        if: env.DEPLOY_TARGET == 'vps'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key. ssh-keyscan here was trust-on-first-use repeated
          # on EVERY deploy: it blessed whatever host answered seconds before
          # connecting, which made StrictHostKeyChecking=yes decorative — an
          # on-path attacker could take the deploy session (and the key it
          # carries) while faking a successful run. Set VPS_HOST_KEY to the
          # VPS's real public key ("ssh-keyscan -p <port> <host>" run once,
          # from a trusted machine).
          if [ -n "${VPS_HOST_KEY:-}" ]; then
            printf '%s\n' "${VPS_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            echo "::warning::VPS_HOST_KEY is not set — falling back to ssh-keyscan (trust-on-first-use). Set the VPS_HOST_KEY repository variable to pin it."
            ssh-keyscan -p "${VPS_SSH_PORT:-22}" "${VPS_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Pull and restart the dev-tier stack on the VPS
        if: env.DEPLOY_TARGET == 'vps'
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_SSH_PORT:-22}"
          REMOTE="${VPS_SSH_USER}@${VPS_HOST}"
          SSH=(ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes "${REMOTE}")

          # IMAGE_TAG is the ENVIRONMENT-NAMESPACED image tag; GIT_SHA is the
          # plain commit and is what `git checkout` below needs. They used to be
          # the same value, which meant the dev tier and production overwrote each
          # other's :<sha> tag with images carrying different baked-in
          # DEPLOY_ENV — a host could then run an image whose release.json
          # (and /api/health) claimed the wrong environment.
          "${SSH[@]}" "REGISTRY_USER=$(printf '%q' "${REGISTRY_USER}") IMAGE_TAG=$(printf '%q' "dev-${GITHUB_SHA}") GIT_SHA=$(printf '%q' "${GITHUB_SHA}") DEPLOY_PATH=$(printf '%q' "${VPS_DEV_DEPLOY_PATH}") bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          export REGISTRY_USER
          export IMAGE_TAG

          # Keep the deploy-relevant tracked config files in sync with the
          # exact commit being deployed. Everything else on this checkout
          # (.env, data volumes, etc.) is untouched.
          git fetch --quiet origin
          git checkout --quiet "${GIT_SHA}" -- docker-compose.yml docker-compose.prod.yml docker-compose.dev.yml

          # No --profile https/tunnel: this project has no Caddy/tunnel
          # service of its own, production's Caddy fronts it instead.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dev.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dev.yml up -d

          # Persist the tag this deploy actually ran -- see the identical
          # comment in deploy-vps.yml. The `${IMAGE_TAG:-dev}` default this
          # file's compose override added is NOT enough on its own: an explicit
          # IMAGE_TAG in the host .env overrides it, and this host's said
          # `latest`, so a manual restart here ran a two-week-old production
          # image while reporting nothing unusual.
          if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          REMOTE_SCRIPT

      - name: Smoke check
        if: env.DEPLOY_TARGET == 'vps'
        env:
          SMOKE_BASE_URL: ${{ vars.VPS_DEV_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "::warning::VPS_DEV_BASE_URL repository variable not set — skipping smoke check."
            exit 0
          fi
          node scripts/smoke-check.mjs --base-url "${SMOKE_BASE_URL}"
