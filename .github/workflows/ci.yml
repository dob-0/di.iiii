name: CI

on:
  # No `push` trigger for dev/main: deploy-vps.yml / deploy-vps-staging.yml
  # call this workflow (workflow_call) as their gating `test` job, so a push
  # to either branch already runs this suite exactly once. A `push` trigger
  # here too would run it a SECOND, fully redundant time in parallel (found
  # during the 2026-07-17 optimization audit — this doubled CI compute and
  # Playwright installs on every deploy push for no benefit, since deploying
  # was already correctly gated).
  pull_request:
    branches: [ dev, main ]
  # Lets deploy-vps.yml / deploy-vps-staging.yml gate their build-and-push
  # job on this same suite passing, instead of deploying regardless of test
  # outcome (audit 2026-07-17 — deploys previously had no test gate at all,
  # only a post-deploy smoke check that itself silently skips if unconfigured).
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          if [ -f serverXR/package-lock.json ]; then
            npm --prefix serverXR ci
          else
            npm --prefix serverXR install
          fi

      # High/critical only — low/moderate advisories churn too often on
      # transitive deps to gate a deploy on; audit-2026-07-18 confirmed 0
      # vulnerabilities at this threshold in both package trees at the time
      # this step was added.
      - name: Audit dependencies (root)
        run: npm audit --production --audit-level=high

      - name: Audit dependencies (serverXR)
        run: npm --prefix serverXR audit --production --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      # Explicit guards: these suites are already covered by `npm run test`
      # (the root vitest config globs serverXR/src/**). Re-running them as named
      # steps keeps the schema-drift / prod-503 contract guard visible in CI logs
      # and resilient to a future change to the vitest include glob.
      - name: Server contract tests
        run: npm run test:server-contracts

      - name: Schema-sync tests
        run: npm run test:schema-sync

      - name: Check for silent hardcoded fallback patterns
        run: npm run check:fallback-patterns

      # Guards the production white-screen/TDZ class: a package that imports
      # three but sits outside the three-vendor manualChunks group is invisible
      # in dev and fatal in the built bundle.
      - name: Check three-vendor chunk allowlist
        run: npm run check:three-vendor

      # docs:ai:check diffs CURRENT.md against origin/dev to enforce that only
      # `npm run land` writes it (see docs/ai/sessions/README.md) -- needs dev's
      # history reachable, which the default shallow checkout doesn't have on a
      # pull_request run. Cheap (depth 50, not full history); the check itself
      # degrades to a no-op if this fetch fails, same shallow-guard shape as its
      # existing freshness check.
      - name: Fetch base ref for docs checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=50 origin ${{ github.base_ref }}

      - name: Check AI docs
        run: npm run docs:ai:check

      - name: Check wiki / user-facing docs
        run: npm run docs:wiki:check

  # Behavioral browser checks (input-device contracts + responsive sweep) —
  # shared with the publish workflow, which gates deploys on the same suite.
  browser-checks:
    uses: ./.github/workflows/browser-checks.yml
