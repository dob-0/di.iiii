name: Deploy VPS Staging (GHCR + SSH)

# Staging deploy path: same VPS as production, a separate low-resource
# Compose project (docker-compose.staging.yml) in its own checkout
# directory so it never inherits production's COMPOSE_PROFILES=https or
# secrets. See docs/deploy/VPS_DOCKER_DEPLOY.md for the one-time host setup
# (second checkout dir, its own .env, Caddyfile's staging site block).

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dii-server
            dockerfile: serverXR/Dockerfile
          - image: dii-client
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_STAGING_DEPLOY_PATH: ${{ vars.VPS_STAGING_DEPLOY_PATH }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SSH deploy configuration
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_SSH_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          if [ -z "${VPS_STAGING_DEPLOY_PATH:-}" ]; then
            echo "::error::Missing required repository variable: VPS_STAGING_DEPLOY_PATH (path to the SEPARATE staging docker-compose checkout on the VPS -- not the production one, see docs/deploy/VPS_DOCKER_DEPLOY.md)"
            missing=1
          fi
          exit "${missing}"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Pull and restart the staging stack on the VPS
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_SSH_PORT:-22}"
          REMOTE="${VPS_SSH_USER}@${VPS_HOST}"
          SSH=(ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes "${REMOTE}")

          "${SSH[@]}" "REGISTRY_USER=$(printf '%q' "${REGISTRY_USER}") IMAGE_TAG=$(printf '%q' "${GITHUB_SHA}") DEPLOY_PATH=$(printf '%q' "${VPS_STAGING_DEPLOY_PATH}") bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          export REGISTRY_USER
          export IMAGE_TAG

          # Keep the deploy-relevant tracked config files in sync with the
          # exact commit being deployed. Everything else on this checkout
          # (.env, data volumes, etc.) is untouched.
          git fetch --quiet origin
          git checkout --quiet "${IMAGE_TAG}" -- docker-compose.yml docker-compose.prod.yml docker-compose.staging.yml

          # No --profile https/tunnel: this project has no Caddy/tunnel
          # service of its own, production's Caddy fronts it instead.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml up -d
          REMOTE_SCRIPT

      - name: Smoke check
        env:
          SMOKE_BASE_URL: ${{ vars.VPS_STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "::warning::VPS_STAGING_BASE_URL repository variable not set — skipping smoke check."
            exit 0
          fi
          node scripts/smoke-check.mjs --base-url "${SMOKE_BASE_URL}"
