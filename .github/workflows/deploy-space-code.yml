name: Deploy space code files

on:
  push:
    branches: [dev]
    paths:
      - 'spaces/*/code/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Push changed space code files to live
        env:
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_API_TOKEN: ${{ secrets.LIVE_API_TOKEN }}
        run: |
          for dir in spaces/*/code; do
            [ -d "$dir" ] || continue
            spaceId=$(echo "$dir" | cut -d/ -f2)
            echo "Pushing code for space: $spaceId"
            node scripts/space-code-push.mjs "$spaceId"
          done
