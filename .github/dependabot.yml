version: 2
updates:
  # Docker base images (node:22-alpine, nginx:alpine, caddy:2-alpine,
  # cloudflare/cloudflared:latest) are floating tags with no update path
  # otherwise — a hand-pinned digest would just go stale/unpatched with
  # nothing to refresh it. Dependabot opens a PR on new releases instead.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /serverXR
    target-branch: dev
    schedule:
      interval: weekly

  # Third-party Actions are SHA-pinned (see known-fixes.md) for supply-chain
  # safety, which means they never move on their own — Dependabot opens a PR
  # (with the SHA re-verified against the new tag) when a real update ships.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  # npm dependency advisories were previously only caught by manually running
  # `npm audit` — CI's new audit step (ci.yml) catches regressions on open
  # PRs, but only Dependabot proactively opens a PR when a new advisory lands
  # against an already-merged dependency.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /serverXR
    target-branch: dev
    schedule:
      interval: weekly
