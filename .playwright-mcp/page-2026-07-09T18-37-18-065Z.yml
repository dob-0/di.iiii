  - generic [ref=f2e31]:
    - heading "City and Time Քաղաքը և ժամանակը" [level=2] [ref=f2e35]:
      - text: City and Time
      - generic [ref=f2e36]: Քաղաքը և ժամանակը
    - generic [ref=f2e37]:
      - generic [ref=f2e38]:
        - paragraph [ref=f2e39]: Քաղաքը, որպես ժամանակների հատման, համակեցության և փոխակերպման տարածք։
        - paragraph [ref=f2e40]: Թեման առաջարկում է անդրադառնալ այն հարցերին, թե ինչպես են քաղաքները կրում հիշողությունը, ինչպես են փոխվում ժամանակի ընթացքում և ինչպիսի ապագաներ կարող ենք պատկերացնել դրանց համար։
        - paragraph [ref=f2e41]: Գյումրին ոչ միայն փառատոնի անցկացման վայրն է, այլև կենդանի հետազոտական միջավայր, որի միջոցով հնարավոր է ուսումնասիրել ժամանակի և քաղաքի փոխհարաբերության բազմազան դրսևորումները։
      - generic [ref=f2e42]:
        - paragraph [ref=f2e43]: The city as a space of intersection, coexistence and transformation of times.
        - paragraph [ref=f2e44]: The theme suggests addressing the questions of how cities carry memory, how they change over time, and what futures we can imagine for them.
        - paragraph [ref=f2e45]: Gyumri is not only the venue for the festival, but also a living research environment through which it is possible to explore the diverse manifestations of the relationship between time and the city.
