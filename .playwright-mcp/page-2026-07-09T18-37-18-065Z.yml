  - generic [ref=f2e16]:
    - generic [ref=f2e17]:
      - paragraph [ref=f2e18]: Բաց կանչ
      - paragraph [ref=f2e19]: Beyond Form-ը եռօրյա ստեղծագործական աշխատարան է, որն իրականացվում է Gyumri Art Week-ի շրջանակում՝ Ժամանակակից արվեստի ինստիտուտի, Գյումրու Գեղարվեստի ակադեմիայի և G.Urban Platform-ի համագործակցությամբ։
      - paragraph [ref=f2e20]: Աշխատարանը նախատեսված է երիտասարդ արվեստագետների, ուսանողների և բոլոր նրանց համար, ովքեր հետաքրքրված են ժամանակակից արվեստով, նոր մեդիաներով, 3D մոդելավորմամբ, 3D տպագրությամբ և վիզուալ պրոյեկցիաներով։
      - paragraph [ref=f2e21]: Եռօրյա աշխատարանի ընթացքում մասնակիցները կծանոթանան թվային արտադրության և վիզուալ տեխնոլոգիաների հնարավորություններին, կզարգացնեն իրենց գաղափարները մենթորների աջակցությամբ և կստեղծեն արվեստի գործեր՝ հիմնված փառատոնի այս տարվա թեմայի վրա։
    - generic [ref=f2e22]:
      - paragraph [ref=f2e23]: Open call
      - paragraph [ref=f2e24]: Beyond Form is a three-day creative workshop, implemented within the framework of Gyumri Art Week, in cooperation with the Institute of Contemporary Art, Gyumri Academy of Fine Arts and G.Urban Platform.
      - paragraph [ref=f2e25]: The workshop is intended for young artists, students and all those who are interested in contemporary art, new media, 3D modeling, 3D printing and visual projections.
      - paragraph [ref=f2e26]: During the three-day workshop, participants will get acquainted with the possibilities of digital production and visual technologies, develop their ideas with the support of mentors and create works of art based on this year's theme of the festival.
