      - generic [ref=f3e26]:
        - paragraph [ref=f3e27]: I’m Taron Grigoryan, a Munich-based visual artist working across photography, film, sound, and objects. I create images that balance precision with curiosity — from handcrafted miniature worlds to portraits, products, campaigns, and visual stories.
        - paragraph [ref=f3e28]: Over the years I’ve had the chance to collaborate with brands including Versace, Teenage Engineering, Jägermeister, AIAIAI, Stylophone, Gulf and many more.
