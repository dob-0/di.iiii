      - generic [ref=f4e26]:
        - paragraph [ref=f4e27]: I’m Taron Grigoryan, a Munich-based visual artist working across photography, film, sound, and objects. I create images that balance precision with curiosity — from handcrafted miniature worlds to portraits, products, campaigns, and visual stories.
