<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lava surface</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
// Lava surface for projectors. Reacts to hub state; falls back to a slow timed loop after 2 s of silence.
// Photosensitive guard: the burn flash is a decaying glow, at most one per 400 ms (< 3 Hz), amplitude capped.
(function () {
  var cv = document.getElementById('c'), g = cv.getContext('2d');
  var st = { lava: 0.5, burn: 0, mode: 'loop' }, seen = 0, burnAt = -1e9, lastBurnAccepted = -1e9;
  var shown = { lava: 0.5, glow: 0 };
  function size() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', size); size();
  var wsUrl = new URLSearchParams(location.search).get('hub') || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=surface');
  var wait = 500;
  function open() {
    var ws;
    try { ws = new WebSocket(wsUrl); } catch (e) { setTimeout(open, wait); return; }
    ws.onopen = function () { wait = 500; };
    ws.onmessage = function (m) {
      try {
        var d = JSON.parse(m.data); if (!d || d.type === 'hello') return;
        seen = Date.now();
        if (typeof d.lava === 'number') st.lava = Math.max(0, Math.min(1, d.lava));
        if (d.event === 'burn' && Date.now() - lastBurnAccepted > 400) { lastBurnAccepted = burnAt = Date.now(); }
        if (d.event === 'win') st.mode = 'won'; else if (d.event === 'dead') st.mode = 'dead';
        else if (d.event === 'start' || d.event === 'restart') st.mode = 'play';
        else if (st.mode === 'loop') st.mode = 'play';
      } catch (e) {}
    };
    ws.onclose = function () { setTimeout(open, wait); wait = Math.min(wait * 2, 8000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  open();
  function col(l) { // deep red -> orange -> yellow-white
    var s = l < 0.55 ? [[90, 0, 0], [255, 77, 0], l / 0.55] : [[255, 77, 0], [255, 230, 140], (l - 0.55) / 0.45];
    return s[0].map(function (v, i) { return Math.round(v + (s[1][i] - v) * s[2]); });
  }
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var t = now / 1000, silent = Date.now() - seen > 2000;
    var target = silent ? 0.5 + 0.35 * Math.sin(t / 40 * 6.283) : st.lava;
    var mode = silent ? 'loop' : st.mode;
    shown.lava += (target - shown.lava) * Math.min(1, dt * 1.5); // slew: no jumps
    var glowT = Math.max(0, 1 - (Date.now() - burnAt) / 600) * 0.35; // capped
    shown.glow += (glowT - shown.glow) * Math.min(1, dt * 8);
    var W = cv.width, H = cv.height, L = shown.lava, speed = 0.15 + L * 0.6;
    var c = col(L), base = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    var bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, 'rgb(' + (c[0] * 0.25 | 0) + ',0,0)'); bg.addColorStop(1, 'rgb(' + (c[0] * 0.6 | 0) + ',' + (c[1] * 0.2 | 0) + ',0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 9; i++) {
      var x = W * (0.5 + 0.45 * Math.sin(t * speed * (0.5 + i * 0.13) + i * 2.1));
      var y = H * (0.5 + 0.4 * Math.sin(t * speed * (0.4 + i * 0.11) + i * 1.3));
      var r = Math.max(W, H) * (0.18 + 0.12 * L);
      var rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.55)'); rg.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
    }
    g.globalCompositeOperation = 'source-over';
    if (mode === 'won') { g.fillStyle = 'rgba(120,200,255,' + (0.18 + 0.06 * Math.sin(t)) + ')'; g.fillRect(0, 0, W, H); }
    if (mode === 'dead') { g.fillStyle = 'rgba(200,0,0,' + (0.22 + 0.12 * Math.sin(t * 3.14)) + ')'; g.fillRect(0, 0, W, H); } // 0.5 Hz
    if (shown.glow > 0.005) { g.fillStyle = 'rgba(255,40,10,' + shown.glow + ')'; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script></body></html>
