<script id="logic">
"use strict";
/* THE FLOOR IS LAVA - FRIENDS MODE. Every finger on the floor is a player. Last finger on the floor wins.
   Pure logic (no DOM): tested by scripts/show/lava/friends.test.mjs. Tune the numbers here. */
const FR = {
  COUNTDOWN_SEC: 3,        // first finger down starts this countdown so friends can join
  GRACE_SEC: 0.5,          // a lifted finger may be put back this fast ...
  GRACE_RADIUS: 2.2,       // ... within this many tiles of where it left
  PLAY_DELAY_SEC: 1.5,     // calm seconds after GO before the first warning
  START_INTERVAL: 1.5,     // seconds between new warnings at the start ...
  MIN_INTERVAL: 0.45,      // ... ramping down to this
  RAMP_SEC: 75,            // seconds to reach full pace
  WARN_START_SEC: 2.0,     // a tile glows this long before it turns to lava at the start ...
  WARN_MIN_SEC: 0.8,       // ... ramping down to this
  LAVA_HOLD_SEC: 3.0,      // lava cools back to stone after this
  MAX_BATCH: 3,            // tiles warned per step at full pace
  FOCUS: 0.6,              // chance a warning lands at/next to a finger (keeps everyone moving)
  FLOOD_SEC: 90,           // safety end: the whole floor warns and floods
  OVER_SEC: 5,             // result shown this long, then restarts by itself
  OVER_TOUCH_SEC: 1.0,     // a touch restarts the round only after this
  HEARTS_MAX: 5            // the hub's heart range is 0..5
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

class Round {
  constructor(opts) {
    this.cols = opts.cols; this.rows = opts.rows; this.rng = opts.rng || Math.random;
    this.C = Object.assign({}, FR, opts.consts || {});
    this.events = [];
    this.reset(false);
  }
  reset(announce) {
    this.phase = "ready"; this.time = 0; this.cd = 0; this.overT = 0; this.nextWarn = 0; this.winner = null; this.result = "";
    this.players = new Map(); this.nextNum = 1; this.total = 0; this.survived = 0; this.outOrder = [];
    this.tiles = new Array(this.cols * this.rows).fill(null).map(() => ({ s: 0, t: 0 })); // s 0 stone, 1 warn, 2 lava
    if (announce) this.emit("restart", null);
  }
  emit(event, tile) { this.events.push({ event, tile: tile || null }); }
  drain() { const e = this.events; this.events = []; return e; }
  tileOf(x, y) { return [Math.max(0, Math.min(this.cols - 1, Math.floor(x))), Math.max(0, Math.min(this.rows - 1, Math.floor(y)))]; }
  cell(c, r) { return this.tiles[r * this.cols + c]; }
  alive() { let n = 0; for (const p of this.players.values()) if (p.alive) n++; return n; }
  hearts() {

  }

    this.players.set(ptr, { num: this.nextNum++, ptr, x, y, c, r, alive: true, lifted: null, lx: x, ly: y });
  }
  down(ptr, x, y) {
    if (this.phase === "over") { if (this.overT < this.C.OVER_TOUCH_SEC) return; this.reset(true); }
    if (this.phase === "ready") { this.phase = "count"; this.cd = this.C.COUNTDOWN_SEC; this.addPlayer(ptr, x, y); return; }
    if (this.phase === "count") { if (!this.players.has(ptr)) this.addPlayer(ptr, x, y); return; }

        const d = Math.hypot(p.lx - x, p.ly - y);

    }
    for (const p of this.players.values()) if (p.alive && p.lifted === null && this.cell(p.c, p.r).s === 2) this.out(p, "lava");

    if (this.time >= this.nextWarn) {
      const k = this.pace();
      const warnSec = this.C.WARN_START_SEC + (this.C.WARN_MIN_SEC - this.C.WARN_START_SEC) * k;
      const batch = 1 + Math.floor(k * (this.C.MAX_BATCH - 1) + 0.5);
      for (let i = 0; i < batch; i++) this.warnOne(warnSec);
      this.nextWarn = this.time + this.C.START_INTERVAL + (this.C.MIN_INTERVAL - this.C.START_INTERVAL) * k;
    }
    if (this.time >= this.C.FLOOD_SEC) for (const t of this.tiles) if (t.s === 0) { t.s = 1; t.t = this.C.WARN_MIN_SEC; }
    this.checkEnd();
  }
  warnOne(sec) {
    const live = [...this.players.values()].filter((p) => p.alive);
    let c, r;
    if (live.length && this.rng() < this.C.FOCUS) {
      const p = live[Math.floor(this.rng() * live.length)];
      c = Math.max(0, Math.min(this.cols - 1, p.c + Math.floor(this.rng() * 3) - 1));
      r = Math.max(0, Math.min(this.rows - 1, p.r + Math.floor(this.rng() * 3) - 1));
    } else { c = Math.floor(this.rng() * this.cols); r = Math.floor(this.rng() * this.rows); }
    const t = this.cell(c, r);
    if (t.s === 0) { t.s = 1; t.t = sec; this.emit("ignite", [c, r]); }
  }
  checkEnd() {
    const a = this.alive();
    const solo = this.total === 1;
    if (solo ? a > 0 : a > 1) return;
    this.phase = "over"; this.overT = 0; this.survived = this.time;
    if (solo || a === 0) { this.winner = null; this.result = solo ? "solo" : "draw"; this.emit("dead", null); }
    else { this.winner = [...this.players.values()].find((p) => p.alive); this.result = "win"; this.emit("win", null); }
  }
}

</script>

    text(secs + " S", artW - 6, 8, 3, "#ffcf40", "right");
    if (g.time < 1.0) bigText("GO", gridY + g.rows * tile / 2 - 20, "#7dff6b", 12);
  } else {
    const mid = gridY + g.rows * tile / 2, top = mid - 70;
    rect(0, top - 8, artW, 160, "rgba(0,0,0,0.8)");
    let y = top;
    if (g.result === "win") { y += bigText("PLAYER " + g.winner.num, y, PCOL[(g.winner.num - 1) % PCOL.length], 6); y += bigText("WINS", y, "#ffcf40", 8); }
    else if (g.result === "solo") { y += bigText("YOU SURVIVED", y, "#ffcf40", 5); y += bigText(Math.floor(g.survived) + " SECONDS", y, "#fff", 6); }
    else { y += bigText("NOBODY WINS", y, "#ff5c5c", 6); y += bigText("THE LAVA WINS", y, "#fff", 5); }
    text("TOUCH TO PLAY AGAIN", artW / 2, y + 6, 2, "#ff9a3c", "center");

  if (flash > 0) { ctx.globalAlpha = Math.min(0.4, flash); rect(0, 0, artW, artH, "#ff5c20"); ctx.globalAlpha = 1; }
}
let lastTs = 0;
function frame(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
  game.update(dt); pump();
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 160 * dt; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0); flash = Math.max(0, flash - dt);
  ctx.setTransform(pixel, 0, 0, pixel, 0, 0); draw(ts);
  fpsFrames++; if (ts - fpsT >= 1000) { window.__fps = fpsFrames * 1000 / (ts - fpsT); fpsFrames = 0; fpsT = ts; }
  requestAnimationFrame(frame);
}
let rt = 0;
function onResize() { clearTimeout(rt); rt = setTimeout(layout, 120); }
function prevent(e) { if (e.cancelable) e.preventDefault(); }
canvas.addEventListener("pointerdown", onDown, { passive: false });
canvas.addEventListener("pointermove", onMove, { passive: false });
canvas.addEventListener("pointerup", onUp, { passive: false });
canvas.addEventListener("pointercancel", onUp, { passive: false });
canvas.addEventListener("contextmenu", prevent);
for (const ev of ["touchstart", "touchmove", "touchend", "gesturestart", "gesturechange", "gestureend", "selectstart"]) document.addEventListener(ev, prevent, { passive: false });
window.addEventListener("resize", onResize); window.addEventListener("orientationchange", onResize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
window.__game = () => game;
layout();
setInterval(function () { if (window.__lh && game) window.__lh("beat", game.level(), game.hearts()); }, 250);
requestAnimationFrame(frame);
</script>
